<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1370" viewBox="0 0 780 1370" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek：两条流分别对齐</title><desc id="desc">Web Controller → Gateway → SessionQuery。服务端:先监听，再读取会话基线，持久历史窗口＋实时 assistant 前缀；历史事件流:以 session seq 维持连续，基线前事件丢弃；缺口触发补页；实时文本流:attempt＋index＋revision，基线前缀与后续 chunk 连续衔接；Web 客户端:新 generation 淘汰旧页，翻旧页可与新事件追加并行；结算显示:durable 记录等待匹配 end，end 丢失需恢复触发；新基线可确认。Host 实时前缀在内存中；它不等于磁盘历史。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#292824}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#968A7A" stroke-width="1.5"/></marker></defs>
<rect width="780" height="1370" rx="20" fill="#F7F5EF"/>
<text x="40" y="53" font-size="25" font-weight="600" style="fill:#964D3B">AGENT HARNESS / 12</text>
<text x="40" y="111" font-size="42" font-weight="700" style="fill:#292824">DeepSeek：两条流分别对齐</text>
<text x="40" y="157" font-size="28" font-weight="400" style="fill:#68645E">Web Controller → Gateway → SessionQuery</text>
<rect x="32" y="196" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="235" font-size="27" font-weight="650" style="fill:#964D3B">01  服务端</text>
<text x="55" y="282" font-size="34" font-weight="650" style="fill:#292824">先监听，再读取会话基线</text>
<text x="55" y="324" font-size="30" font-weight="400" style="fill:#68645E">持久历史窗口＋实时 assistant 前缀</text>
<path d="M390 354 L390 380" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="390" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="429" font-size="27" font-weight="650" style="fill:#964D3B">02  历史事件流</text>
<text x="55" y="476" font-size="34" font-weight="650" style="fill:#292824">以 session seq 维持连续</text>
<text x="55" y="518" font-size="30" font-weight="400" style="fill:#68645E">基线前事件丢弃；缺口触发补页</text>
<path d="M390 548 L390 574" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="584" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="623" font-size="27" font-weight="650" style="fill:#964D3B">03  实时文本流</text>
<text x="55" y="670" font-size="34" font-weight="650" style="fill:#292824">attempt＋index＋revision</text>
<text x="55" y="712" font-size="30" font-weight="400" style="fill:#68645E">基线前缀与后续 chunk 连续衔接</text>
<path d="M390 742 L390 768" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="817" font-size="27" font-weight="650" style="fill:#964D3B">04  Web 客户端</text>
<text x="55" y="864" font-size="34" font-weight="650" style="fill:#292824">新 generation 淘汰旧页</text>
<text x="55" y="906" font-size="30" font-weight="400" style="fill:#68645E">翻旧页可与新事件追加并行</text>
<path d="M390 936 L390 962" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="972" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="1011" font-size="27" font-weight="650" style="fill:#964D3B">05  结算显示</text>
<text x="55" y="1058" font-size="34" font-weight="650" style="fill:#292824">durable 记录等待匹配 end</text>
<text x="55" y="1100" font-size="30" font-weight="400" style="fill:#68645E">end 丢失需恢复触发；新基线可确认</text>
<rect x="32" y="1180" width="716" height="116" rx="18" fill="#EFEBE3"/>
<text x="55" y="1226" font-size="32" font-weight="600" style="fill:#292824">Host 实时前缀在内存中；它不等于磁盘历史。</text>
<text x="40" y="1340" font-size="23" font-weight="400" style="fill:#68645E">固定源码 D12b / D12f / D12g / D12h</text>
</svg>
