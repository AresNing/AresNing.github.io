<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1370" viewBox="0 0 780 1370" role="img" aria-labelledby="title desc">
<title id="title">Codex：重新附着原线程</title><desc id="desc">远端 TUI → App Server → 历史与活动 turn。TUI:新连接＋bootstrap，已知 thread ID；不自动重发 prompt；TUI → App Server:调用 thread/resume，读取历史；为运行中线程准备交接；线程监听器:合并活动 turn，加入订阅，resume 命令组织快照与通知边界；TUI:安装新通道和线程视图，隔离旧工作；分页补足较早的内容；历史＋实时事件:继续更新原 thread，局部全文覆盖 delta，不是通用回放。分页游标用于定位；
不等于冻结整个历史版本。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#292824}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#968A7A" stroke-width="1.5"/></marker></defs>
<rect width="780" height="1370" rx="20" fill="#F7F5EF"/>
<text x="40" y="53" font-size="25" font-weight="600" style="fill:#964D3B">AGENT HARNESS / 12</text>
<text x="40" y="111" font-size="42" font-weight="700" style="fill:#292824">Codex：重新附着原线程</text>
<text x="40" y="157" font-size="28" font-weight="400" style="fill:#68645E">远端 TUI → App Server → 历史与活动 turn</text>
<rect x="32" y="196" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="235" font-size="27" font-weight="650" style="fill:#964D3B">01  TUI</text>
<text x="55" y="282" font-size="34" font-weight="650" style="fill:#292824">新连接＋bootstrap</text>
<text x="55" y="324" font-size="30" font-weight="400" style="fill:#68645E">已知 thread ID；不自动重发 prompt</text>
<path d="M390 354 L390 380" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="390" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="429" font-size="27" font-weight="650" style="fill:#964D3B">02  TUI → App Server</text>
<text x="55" y="476" font-size="34" font-weight="650" style="fill:#292824">调用 thread/resume</text>
<text x="55" y="518" font-size="30" font-weight="400" style="fill:#68645E">读取历史；为运行中线程准备交接</text>
<path d="M390 548 L390 574" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="584" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="623" font-size="27" font-weight="650" style="fill:#964D3B">03  线程监听器</text>
<text x="55" y="670" font-size="34" font-weight="650" style="fill:#292824">合并活动 turn，加入订阅</text>
<text x="55" y="712" font-size="30" font-weight="400" style="fill:#68645E">resume 命令组织快照与通知边界</text>
<path d="M390 742 L390 768" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="817" font-size="27" font-weight="650" style="fill:#964D3B">04  TUI</text>
<text x="55" y="864" font-size="34" font-weight="650" style="fill:#292824">安装新通道和线程视图</text>
<text x="55" y="906" font-size="30" font-weight="400" style="fill:#68645E">隔离旧工作；分页补足较早的内容</text>
<path d="M390 936 L390 962" stroke="#968A7A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="972" width="716" height="158" rx="18" fill="white" stroke="#DCD7CD" stroke-width="2"/>
<text x="55" y="1011" font-size="27" font-weight="650" style="fill:#964D3B">05  历史＋实时事件</text>
<text x="55" y="1058" font-size="34" font-weight="650" style="fill:#292824">继续更新原 thread</text>
<text x="55" y="1100" font-size="30" font-weight="400" style="fill:#68645E">局部全文覆盖 delta，不是通用回放</text>
<rect x="32" y="1180" width="716" height="116" rx="18" fill="#EFEBE3"/>
<text x="55" y="1226" font-size="32" font-weight="600" style="fill:#292824">分页游标用于定位；</text>
<text x="55" y="1268" font-size="32" font-weight="600" style="fill:#292824">不等于冻结整个历史版本。</text>
<text x="40" y="1340" font-size="23" font-weight="400" style="fill:#68645E">固定源码 C12 / C12c / C12f / C12k</text>
</svg>
