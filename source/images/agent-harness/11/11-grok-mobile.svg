<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>设计启发 · Grok：删除资源要晚于退出确认</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 11</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">设计启发 · Grok：删除资源要</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">晚于退出确认</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">子任务结果或启动失败</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">状态不代表资源已退出</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">拥有的 thread 已结束？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">先取消并等待核实</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">已确认 → 按所有权清理资源</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">仅清理本次有权删除的对象</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">未确认 → 保留资源并报告待处理</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">避免活进程继续访问已删目录</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">设计建议：结果、记录和资源分别有状态；未</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">知不能显示成已回收。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>