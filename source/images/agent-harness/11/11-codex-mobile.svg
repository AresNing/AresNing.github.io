<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>设计启发 · Codex：证据与解释分开保存</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 11</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">设计启发 · Codex：证据与解释</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">分开保存</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分支关系示意，不表示耗时比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">原始运行记录</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">不在热路径强行合成全图</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">分支一 → 模型可见 payload</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">证明模型实际输入与输出</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">分支二 → runtime 观察</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">证明工具 / code cell 边界</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">两支汇合 → 有来源的语义关系</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">同时保留 raw 引用与缺失状态</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">设计建议：保留关联依据；证据未齐时显示待</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">关联，不能伪造因果。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>