<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">设计启发 · DeepSeek：不要提供万能 save</title>
<desc id="desc">设计建议：业务持久性与观测 handoff 使用不同承诺。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#968A7A"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#968A7A;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#F7F5EF"/>
<text x="64" y="53" font-size="19" fill="#964D3B" text-anchor="start" font-weight="400">AGENT HARNESS   /   11   /   DeepSeek</text>
<text x="64" y="130" font-size="42" fill="#292824" text-anchor="start" font-weight="700">设计启发 · DeepSeek：不要提供万能 save</text>
<text x="64" y="166" font-size="21" fill="#68645E" text-anchor="start" font-weight="400">分层责任：每一行独立说明一个边界</text>
<rect x="64" y="199" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="199" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="247" font-size="26" fill="#292824" text-anchor="start" font-weight="650">内存历史</text>
<text x="356" y="248" font-size="27" fill="#292824" text-anchor="start" font-weight="400">结果已经可见</text>
<path class="edge" d="M794 255 L865 255"/>
<text x="897" y="247" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">观察者可以读取</text>
<rect x="64" y="329" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="329" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="377" font-size="26" fill="#292824" text-anchor="start" font-weight="650">持久化后端</text>
<text x="356" y="378" font-size="27" fill="#292824" text-anchor="start" font-weight="400">接受写入并完成所需 flush</text>
<path class="edge" d="M794 385 L865 385"/>
<text x="897" y="377" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">按后端声明建立恢复依据</text>
<rect x="64" y="459" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="459" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="507" font-size="26" fill="#292824" text-anchor="start" font-weight="650">遥测 sink</text>
<text x="356" y="508" font-size="27" fill="#292824" text-anchor="start" font-weight="400">记录已交接</text>
<path class="edge" d="M794 515 L865 515"/>
<text x="897" y="507" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">不证明远端已收到</text>
<rect x="64" y="589" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="589" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="637" font-size="26" fill="#292824" text-anchor="start" font-weight="650">外部环境</text>
<text x="356" y="638" font-size="27" fill="#292824" text-anchor="start" font-weight="400">副作用实际发生</text>
<path class="edge" d="M794 645 L865 645"/>
<text x="897" y="637" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">需工具及外部服务提供证据</text>
<rect x="64" y="742" width="1312" height="91" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="87" y="784" font-size="25" fill="#292824" text-anchor="start" font-weight="500">设计建议：业务持久性与观测 handoff 使用不同承诺。</text>
<text x="64" y="869" font-size="18" fill="#68645E" text-anchor="start" font-weight="400">固定源码启发 → 本文设计建议</text>
<text x="1376" y="869" font-size="17" fill="#68645E" text-anchor="end" font-weight="400">D06d · D10e</text>
