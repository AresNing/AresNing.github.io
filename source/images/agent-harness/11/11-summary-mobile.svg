<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>把源码差异转成有代价说明的设计约束</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 11</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">把源码差异转成有代价说明的设计</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">约束</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Codex 启发</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">保留 raw 与模型源证据</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">不靠便利输出伪造模型可见性</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Pi 启发</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">保留多次观察与取消阶段</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">不覆盖事件，不猜 attempt</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">DeepSeek 启发</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">区分持久与遥测交接</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">不把 handoff 当 delivered</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">Grok 启发</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">控制权与资源生命分开</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">退出未确认时保留资源</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">已交付的是只读 Pi 轨迹查看器；运行控制</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">与跨产品状态机仍是建议。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>