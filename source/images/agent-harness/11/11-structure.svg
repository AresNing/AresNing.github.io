<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img"><title>只读轨迹查看器的数据路径</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#964D3B"/></marker></defs><rect width="900" height="800" fill="#F7F5EF"/><text x="32" y="40" font-size="18" text-anchor="start" fill="#964D3B">AGENT HARNESS / 11</text><text x="32" y="90" font-size="30" text-anchor="start" fill="#292824">只读轨迹查看器的数据路径</text><path d="M450 200 V233" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 300 V333" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 400 L680 438" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 400 V543" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 505 L450 543" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 610 V643" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><rect x="280" y="140" width="340" height="60" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="450" y="178" font-size="23" text-anchor="middle" fill="#292824">固定实验 JSONL</text><rect x="280" y="240" width="340" height="60" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="450" y="278" font-size="23" text-anchor="middle" fill="#292824">校验场景与递增序号</text><rect x="280" y="340" width="340" height="60" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="450" y="378" font-size="23" text-anchor="middle" fill="#292824">保留原始记录</text><rect x="510" y="445" width="340" height="60" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="680" y="483" font-size="23" text-anchor="middle" fill="#292824">按场景和 call ID 收集观察</text><rect x="280" y="550" width="340" height="60" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="450" y="588" font-size="23" text-anchor="middle" fill="#292824">内嵌原始数据</text><rect x="280" y="650" width="340" height="60" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="450" y="688" font-size="23" text-anchor="middle" fill="#292824">只读 HTML</text><text x="32" y="770" font-size="20" text-anchor="start" fill="#68645E">仅表达原稿的关系，不表示耗时比例。</text></svg>