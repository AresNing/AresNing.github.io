<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>设计启发 · DeepSeek：不要提供万能 save</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 11</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">设计启发 · DeepSeek：不要提</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">供万能 save</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分层责任：每一行独立说明一个边界</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">内存历史</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">结果已经可见</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">观察者可以读取</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">持久化后端</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">接受写入并完成所需 flush</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">按后端声明建立恢复依据</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">遥测 sink</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">记录已交接</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">不证明远端已收到</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">外部环境</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">副作用实际发生</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">需工具及外部服务提供证据</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">设计建议：业务持久性与观测 handoff 使用</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">不同承诺。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>