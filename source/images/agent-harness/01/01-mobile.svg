<svg xmlns="http://www.w3.org/2000/svg" width="480" height="987" viewBox="0 0 480 987" role="img"><title>一轮何时结束</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="987" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 01</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">一轮何时结束</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">模型结束、循环结束、资源结算是不同边界</text><rect x="24" y="174" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">无欠工作后仍需通过停止门</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">固定源码 c4017a87aacc · 取证卡 </text><text x="42" y="300" font-size="21" fill="#68645E" font-weight="400">C01c</text><rect x="24" y="343" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="377" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">边界停止优先于队列轮询</text><text x="42" y="440" font-size="21" fill="#68645E" font-weight="400">固定源码 71dca871bc80 · 取证卡 </text><text x="42" y="469" font-size="21" fill="#68645E" font-weight="400">P01</text><rect x="24" y="512" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="546" font-size="24" fill="#292824" font-weight="650">DeepSeek Harness</text><text x="42" y="580" font-size="21" fill="#68645E" font-weight="400">取消后唤醒转交新的 driver</text><text x="42" y="609" font-size="21" fill="#68645E" font-weight="400">固定源码 c291e7961a51 · 取证卡 </text><text x="42" y="638" font-size="21" fill="#68645E" font-weight="400">D01b</text><rect x="24" y="681" width="432" height="174" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="715" font-size="24" fill="#292824" font-weight="650">Grok Build</text><text x="42" y="749" font-size="21" fill="#68645E" font-weight="400">conversation 外仍有 goal/stop </text><text x="42" y="778" font-size="21" fill="#68645E" font-weight="400">gate</text><text x="42" y="807" font-size="21" fill="#68645E" font-weight="400">固定源码 37949780c144 · 取证卡 </text><text x="42" y="836" font-size="21" fill="#68645E" font-weight="400">G01c</text><text x="24" y="887" font-size="21" fill="#68645E" font-weight="400">新增 Pi 实测：边界停止后，follow-up 回</text><text x="24" y="916" font-size="21" fill="#68645E" font-weight="400">调调用次数为 0。</text><text x="24" y="959" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>