<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Codex：无新工具，不一定可以退出</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 01</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：无新工具，不一定可以退</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">出</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">一次采样及工具收尾</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">先取得本次运行结果</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">欠工作或停止门要求继续？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">保留正文中的各项分支</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">需要继续 → 继续下一次工作</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">不能提前结束 turn</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">允许结束 → 允许退出</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">到达 core 的结束边界</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">“停止”要结合欠工作和停止门判断，不能只</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">读取模型 stop 字段。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>