<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Pi：停止检查优先于 follow-up 轮询</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 01</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：停止检查优先于 follow-up</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650"> 轮询</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">本次模型与工具处理完成</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">发出内部 turn_end</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">shouldStopAfterTurn？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">先判断边界停止</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">true → 进入 agent_end 路径</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">不再轮询 follow-up</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">false → 继续检查后续输入</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">steering / follow-up 决定续跑</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">实测停止条件成立时，follow-up 回调调用</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">次数为 0。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>