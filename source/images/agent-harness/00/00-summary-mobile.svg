<svg xmlns="http://www.w3.org/2000/svg" width="480" height="776" viewBox="0 0 480 776" role="img"><title>按责任交接读架构</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="776" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">按责任交接读架构</text><rect x="24" y="134" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="168" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="202" font-size="21" fill="#68645E" font-weight="400">输入准入与 step 视图</text><text x="42" y="231" font-size="21" fill="#68645E" font-weight="400">一致视图下采样和执行</text><rect x="24" y="268" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="302" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="336" font-size="21" fill="#68645E" font-weight="400">轻量循环 / RPC / durable</text><text x="42" y="365" font-size="21" fill="#68645E" font-weight="400">按具体入口限定结论</text><rect x="24" y="402" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="436" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="470" font-size="21" fill="#68645E" font-weight="400">服务组合与 live 身份</text><text x="42" y="499" font-size="21" fill="#68645E" font-weight="400">跨 await 后重新核对所有者</text><rect x="24" y="536" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="570" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="604" font-size="21" fill="#68645E" font-weight="400">Actor 控制与并发执行</text><text x="42" y="633" font-size="21" fill="#68645E" font-weight="400">分别追到工具与协议收尾</text><text x="24" y="678" font-size="21" fill="#68645E" font-weight="400">每条箭头都应能回答：谁接纳、谁执行、谁拥</text><text x="24" y="707" font-size="21" fill="#68645E" font-weight="400">有最后的事实。</text><text x="24" y="748" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>