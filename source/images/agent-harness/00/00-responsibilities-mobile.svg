<svg xmlns="http://www.w3.org/2000/svg" width="480" height="729" viewBox="0 0 480 729" role="img"><title>任务中的责任交接</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="729" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">任务中的责任交接</text><rect x="24" y="134" width="432" height="197" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="168" font-size="24" fill="#292824" font-weight="650">主链：输入 → 执行 → 记录</text><text x="42" y="202" font-size="21" fill="#68645E" font-weight="400">客户端提交输入 → 准入与任务身份</text><text x="42" y="231" font-size="21" fill="#68645E" font-weight="400">→ 上下文及工具视图</text><text x="42" y="260" font-size="21" fill="#68645E" font-weight="400">→ 模型流与完整性判断</text><text x="42" y="289" font-size="21" fill="#68645E" font-weight="400">→ 工具准入及授权</text><text x="42" y="318" font-size="21" fill="#68645E" font-weight="400">→ 环境中的动作 → 结果及历史记录</text><rect x="24" y="355" width="432" height="139" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="389" font-size="24" fill="#292824" font-weight="650">历史记录之后</text><text x="42" y="423" font-size="21" fill="#68645E" font-weight="400">结果及历史记录 → 上下文及工具视图</text><text x="42" y="452" font-size="21" fill="#68645E" font-weight="400">结果及历史记录 → 持久化与恢复依据</text><text x="42" y="481" font-size="21" fill="#68645E" font-weight="400">结果及历史记录 → 客户端与诊断投影</text><rect x="24" y="518" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="552" font-size="24" fill="#292824" font-weight="650">取消分支</text><text x="42" y="586" font-size="21" fill="#68645E" font-weight="400">准入与任务身份 → 取消及资源所有权</text><text x="42" y="615" font-size="21" fill="#68645E" font-weight="400">取消及资源所有权 → 工具准入及授权</text><text x="24" y="660" font-size="21" fill="#68645E" font-weight="400">按职责分层；箭头不表示原子事务。</text><text x="24" y="701" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>