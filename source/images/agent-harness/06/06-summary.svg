<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">恢复成功必须说明恢复了哪个状态域</title>
<desc id="desc">没有结果只意味着证据缺失；不能直接推断没执行或安全可重跑。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#968A7A"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#968A7A;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#F7F5EF"/>
<text x="64" y="53" font-size="19" fill="#964D3B" text-anchor="start" font-weight="400">AGENT HARNESS   /   06   /   本篇总结</text>
<text x="64" y="130" font-size="42" fill="#292824" text-anchor="start" font-weight="700">恢复成功必须说明恢复了哪个状态域</text>
<text x="64" y="166" font-size="21" fill="#68645E" text-anchor="start" font-weight="400">四者对照：保留机制差异，不作能力排名</text>
