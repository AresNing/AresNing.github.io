<text x="86" y="637" font-size="26" fill="#292824" text-anchor="start" font-weight="650">Grok</text>
<text x="356" y="638" font-size="27" fill="#292824" text-anchor="start" font-weight="400">Git / 文件 / live tracker</text>
<path class="edge" d="M794 645 L865 645"/>
<text x="897" y="637" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">逐域验证，不合并成总成功</text>
