<text x="356" y="248" font-size="27" fill="#292824" text-anchor="start" font-weight="400">有效 rollout 与 rollback</text>
<path class="edge" d="M794 255 L865 255"/>
<text x="897" y="247" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">重建存活 checkpoint + suffix</text>
<rect x="64" y="329" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="329" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="377" font-size="26" fill="#292824" text-anchor="start" font-weight="650">Pi</text>
<text x="356" y="378" font-size="27" fill="#292824" text-anchor="start" font-weight="400">effect_pending 工具</text>
<path class="edge" d="M794 385 L865 385"/>
<text x="897" y="377" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">旧新双 safe 且未取消才重放</text>
<rect x="64" y="459" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="459" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="507" font-size="26" fill="#292824" text-anchor="start" font-weight="650">DeepSeek</text>
<text x="356" y="508" font-size="27" fill="#292824" text-anchor="start" font-weight="400">可见历史与待写队列</text>
<path class="edge" d="M794 515 L865 515"/>
<text x="897" y="507" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">按存储路径确认持久边界</text>
