<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>恢复成功必须说明恢复了哪个状态域</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 06</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">恢复成功必须说明恢复了哪个状态</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">域</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">有效 rollout 与 rollback</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">重建存活 checkpoint + suffix</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">effect_pending 工具</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">旧新双 safe 且未取消才重放</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">可见历史与待写队列</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">按存储路径确认持久边界</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">Git / 文件 / live tracker</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">逐域验证，不合并成总成功</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">没有结果只意味着证据缺失；不能直接推断没</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">执行或安全可重跑。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>