<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Grok：Actor 终态之后，协议入口仍有工作</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 09</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：Actor 终态之后，协议入</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">口仍有工作</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">分发 prompt 后 释放锁</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">等待 Actor receiver</text><path d="M240 300 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">Actor 返回终态</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">取得 stop reason 与usage</text><path d="M240 411 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">发通知并组织收尾</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">部分上传等待或转后台</text><path d="M240 522 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">返回 ACP response</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">包含对应结果与元数据</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">prompt_complete 发起发送，不代表对端已</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">经消费所有状态。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>