<svg xmlns="http://www.w3.org/2000/svg" width="480" height="937" viewBox="0 0 480 937" role="img"><title>Pi：输出屏障等待的是会增长的 tail</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="937" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 09</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：输出屏障等待的是会增长的 </text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">tail</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · 输出生产者 → 串行 </text><text x="42" y="276" font-size="24" fill="#292824" font-weight="650">writer</text><text x="42" y="310" font-size="21" fill="#68645E" font-weight="400">加入输出 A</text><rect x="24" y="353" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="387" font-size="24" fill="#292824" font-weight="650">02 · 等待者 → 串行 writer</text><text x="42" y="421" font-size="21" fill="#68645E" font-weight="400">等待当前 tail</text><rect x="24" y="464" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">03 · 输出生产者 → 串行 </text><text x="42" y="530" font-size="24" fill="#292824" font-weight="650">writer</text><text x="42" y="564" font-size="21" fill="#68645E" font-weight="400">等待期间又加入 B</text><rect x="24" y="607" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="641" font-size="24" fill="#292824" font-weight="650">04 · 串行 writer → 等待者</text><text x="42" y="675" font-size="21" fill="#68645E" font-weight="400">A 回调完成：tail 已改变</text><rect x="24" y="718" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="752" font-size="24" fill="#292824" font-weight="650">05 · 串行 writer → 等待者</text><text x="42" y="786" font-size="21" fill="#68645E" font-weight="400">B 完成后才释放屏障</text><text x="24" y="837" font-size="21" fill="#68645E" font-weight="400">等待 A 时加入 B，释放 A 之后仍要继续等 </text><text x="24" y="866" font-size="21" fill="#68645E" font-weight="400">B。</text><text x="24" y="909" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>