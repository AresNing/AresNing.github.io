<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img"><title>请求返回值只承诺所在阶段</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="842" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 09</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">请求返回值只承诺所在阶段</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="174" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">turn/start 被接纳</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">返回 Started 或 Steered 目标</text><rect x="24" y="314" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="348" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="382" font-size="21" fill="#68645E" font-weight="400">prompt 预检成功</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">之后事件与结算仍可失败或等待</text><rect x="24" y="454" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="488" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="522" font-size="21" fill="#68645E" font-weight="400">返回 messageId</text><text x="42" y="551" font-size="21" fill="#68645E" font-weight="400">超时不发送远端取消</text><rect x="24" y="594" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="628" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="662" font-size="21" fill="#68645E" font-weight="400">等待 Actor 终态</text><text x="42" y="691" font-size="21" fill="#68645E" font-weight="400">后续通知与收尾再形成 response</text><text x="24" y="742" font-size="21" fill="#68645E" font-weight="400">客户端应保存请求身份和运行身份；超时、断</text><text x="24" y="771" font-size="21" fill="#68645E" font-weight="400">连与取消不能互相替代。</text><text x="24" y="814" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>