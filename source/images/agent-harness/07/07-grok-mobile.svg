<svg xmlns="http://www.w3.org/2000/svg" width="480" height="905" viewBox="0 0 480 905" role="img"><title>Grok：顺序检查原输入，不是变换流水线</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="905" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 07</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：顺序检查原输入，不是变</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">换流水线</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · dispatcher → Hook A</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">传原始 envelope</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · Hook A → dispatcher</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">返回改写 A</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">03 · dispatcher → Hook B</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">仍传原始 envelope</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">04 · Hook B → dispatcher</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">返回改写 B 或 Deny</text><rect x="24" y="654" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="688" font-size="24" fill="#292824" font-weight="650">05 · dispatcher → </text><text x="42" y="720" font-size="24" fill="#292824" font-weight="650">dispatcher</text><text x="42" y="754" font-size="21" fill="#68645E" font-weight="400">聚合改写；Deny 则阻断</text><text x="24" y="805" font-size="21" fill="#68645E" font-weight="400">Deny 会短路并丢弃先前改写；Failed 则记</text><text x="24" y="834" font-size="21" fill="#68645E" font-weight="400">录诊断后继续。</text><text x="24" y="877" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>