<svg xmlns="http://www.w3.org/2000/svg" width="480" height="794" viewBox="0 0 480 794" role="img"><title>Codex：第二次 attempt 有自己的资格与审批</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="794" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 05</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：第二次 attempt 有自己</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">的资格与审批</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">第一次 sandbox attempt</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">保留执行环境所有权</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">SandboxDenied 且可升级？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">还需核对重审 / 复用条件</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">资格与审批满足 → 至多第二次 </text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">attempt</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">使用这次允许的权限范围</text><rect x="24" y="575" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">不满足 → 返回当前错误</text><text x="42" y="643" font-size="21" fill="#68645E" font-weight="400">不能任意扩大执行范围</text><text x="24" y="694" font-size="21" fill="#68645E" font-weight="400">只能在允许的拒绝路径上再次尝试；不能把批</text><text x="24" y="723" font-size="21" fill="#68645E" font-weight="400">准当作永久通行证。</text><text x="24" y="766" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>