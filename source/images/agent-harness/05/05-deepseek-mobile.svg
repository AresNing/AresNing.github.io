<svg xmlns="http://www.w3.org/2000/svg" width="480" height="794" viewBox="0 0 480 794" role="img"><title>DeepSeek：一次批准只改变本次 request</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="794" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 05</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：一次批准只改变本次 </text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">request</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">解析 effective mode</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">检查参数与 justification 配对</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">目标严格扩大且 allowed-once？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">先验证资格，再请求审批</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">合法且允许一次 → 为本次调用构</text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">造 policy</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">执行获准的模式</text><rect x="24" y="575" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">其余结果 → 拒绝、取消或抛错</text><text x="42" y="643" font-size="21" fill="#68645E" font-weight="400">不取得本次 granted mode</text><text x="24" y="694" font-size="21" fill="#68645E" font-weight="400">standing policy 不因此写回；无效扩大不</text><text x="24" y="723" font-size="21" fill="#68645E" font-weight="400">会发起审批。</text><text x="24" y="766" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>