<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>Pi：取到 stream 和读完 stream 是两条边界</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 02</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：取到 stream 和读完 </text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">stream 是两条边界</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分层责任：每一行独立说明一个边界</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">取流请求</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">HTTP / provider 返回 stream</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">先经过请求层重试判断</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">退避策略</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">429、服务端 veto、Retry-After</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">预算不允许时直接失败</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">消费响应</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">增量文本与参数逐步到达</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">需等待语义终态</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">调用工具</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">完整性决定能否执行</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">length 时不执行半截参数</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">请求阶段的退避策略，不能自动覆盖消费流中</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">的所有失败。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>