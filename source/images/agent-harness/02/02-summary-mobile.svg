<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img"><title>可靠流需要多层终态判断</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="842" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 02</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">可靠流需要多层终态判断</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="174" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">流失败后准备重试</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">先重建含已提交工具的输入</text><rect x="24" y="314" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="348" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="382" font-size="21" fill="#68645E" font-weight="400">HTTP 请求取得 stream</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">还需正确消费流与工具终态</text><rect x="24" y="454" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="488" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="522" font-size="21" fill="#68645E" font-weight="400">assembler 能组装对象</text><text x="42" y="551" font-size="21" fill="#68645E" font-weight="400">companion 单独校验协议</text><rect x="24" y="594" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="628" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="662" font-size="21" fill="#68645E" font-weight="400">同样遇到 Length</text><text x="42" y="691" font-size="21" fill="#68645E" font-weight="400">适配器与工具分支改变处理</text><text x="24" y="742" font-size="21" fill="#68645E" font-weight="400">能解析 JSON、收到完整响应、允许执行和提</text><text x="24" y="771" font-size="21" fill="#68645E" font-weight="400">交历史，不能合成一个成功。</text><text x="24" y="814" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>