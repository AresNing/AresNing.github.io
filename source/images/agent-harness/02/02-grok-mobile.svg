<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Grok：Chat Completions 的 Length 有特殊优先级</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 02</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：Chat Completions 的 </text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">Length 有特殊优先级</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Chat Completions 响应</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">收到 finish reason</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">Length 同时带工具调用？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">检查可用的工具输出</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">有工具 → 保留工具调用路径</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">工具分支覆盖 Length</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">无工具 → 进入相应 Length 处理</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">再看本层的策略决定</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">这一优先级属于该适配器，不能推广到所有模</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">型协议。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>