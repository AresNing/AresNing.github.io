<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>DeepSeek：能组装对象，不代表流协议完整</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 02</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：能组装对象，不代表</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">流协议完整</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分支关系示意，不表示耗时比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">原始增量帧</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">可能缺少正式终态</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">分支一 → assembler 组装</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">构造可用的中间对象</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">分支二 → invariant companion</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">独立核对流语法与结束</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">两支汇合 → attempt 提交</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">按实际组合路径决定可提交结果</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">组装默认值不等于协议通过；两条分支表示职</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">责，不表示并发执行。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>