<svg xmlns="http://www.w3.org/2000/svg" width="480" height="794" viewBox="0 0 480 794" role="img"><title>Grok：未 promotion 时，先等退出再决定删资源</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="794" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 08</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：未 promotion 时，先等</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">退出再决定删资源</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">初始 prompt 接纳与 promotion</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">可能被取消或超时打断</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">取消并有界等待 shutdown</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">核对 thread 是否已退出</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">退出且可清理 → 确认退出且是新</text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">建 worktree</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">才清理这次创建的资源</text><rect x="24" y="575" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">仍存活 → 线程仍然存活</text><text x="42" y="643" font-size="21" fill="#68645E" font-weight="400">保留 workspace / worktree</text><text x="24" y="694" font-size="21" fill="#68645E" font-weight="400">宁可保留仍被活进程占用的工作区，也不假装</text><text x="24" y="723" font-size="21" fill="#68645E" font-weight="400">资源已经回收。</text><text x="24" y="766" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>