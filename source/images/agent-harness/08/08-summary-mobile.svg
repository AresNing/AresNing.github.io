<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>创建、接纳、结果、结算与退出分开观察</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 08</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">创建、接纳、结果、结算与退出分</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">开观察</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">thread 已注册</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">后续首条投递仍可能失败</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Pi 示例</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">SIGTERM 已发送</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">必须核实实际进程是否退出</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">result 已经完成</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">settleRun 仍等待 dispose</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">promotion 之前被打断</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">未退出则保留工作区资源</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">有子任务 ID 不证明首条任务成功；有输出</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">也不证明资源已回收。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>