<svg xmlns="http://www.w3.org/2000/svg" width="480" height="873" viewBox="0 0 480 873" role="img"><title>Pi 示例：killed 标志不证明进程已经退出</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="873" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 08</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi 示例：killed 标志不证明进</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">程已经退出</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · 父调用 → 子进程</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">发送 SIGTERM</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · 子进程 → 父调用</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">killed=true，但进程仍活着</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">03 · 父调用 → 强杀兜底</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">5 秒计时器触发</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">04 · 强杀兜底 → 父调用</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">检查 killed，未继续 SIGKILL</text><rect x="24" y="654" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="688" font-size="24" fill="#292824" font-weight="650">05 · 父调用 → 子进程</text><text x="42" y="722" font-size="21" fill="#68645E" font-weight="400">实验显式 SIGKILL 后等待退出</text><text x="24" y="773" font-size="21" fill="#68645E" font-weight="400">实验使用受控 Node 子进程；显式强杀并等</text><text x="24" y="802" font-size="21" fill="#68645E" font-weight="400">待退出，另设 watchdog 防止遗留。</text><text x="24" y="845" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>