<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Codex：等待、执行与结果收集分别推进</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 04</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：等待、执行与结果收集分</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">别推进</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">等待 runtime ready</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">运行环境先准备好</text><path d="M240 300 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">共享 / 独占准入锁</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">决定并发资格</text><path d="M240 411 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">handler 执行完成</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">记录 result_ready</text><path d="M240 522 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">调用者有序收集</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">再组织模型可用结果</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">result_ready 早于调用者编码或有序收集，</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">不表示已进入下次模型输入。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>