<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>并发至少有准备、执行、提交三种顺序</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 04</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">并发至少有准备、执行、提交三种</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">顺序</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">readiness 与准入锁</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">执行 ready 后仍等有序收集</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">整批 prepare 屏障</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">并发执行后按原序组织结果</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">滚动补位启动新工具</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">提交指针保持原调用顺序</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">局部路径锁限制冲突</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">完成序 drainer 先处理已完成项</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">快工具已经 ready，不代表结果已经提交；</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">互斥也不自动建立业务依赖。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>