<svg xmlns="http://www.w3.org/2000/svg" width="480" height="794" viewBox="0 0 480 794" role="img"><title>Pi：100% 的分母可能只包含部分启动样本</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="794" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 10</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：100% 的分母可能只包含部分</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">启动样本</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">同组 baseline / candidate</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">先按 repetition 配对</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">双方恰有一条且均 scored？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">不同指标还需有效数值</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">可评分配对 → 纳入 </text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">eligiblePairs</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">计算 pass rate / 成对指标</text><rect x="24" y="575" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">其余情况 → 另列 diagnostic</text><text x="42" y="643" font-size="21" fill="#68645E" font-weight="400">缺失、重复或 Harness error</text><text x="24" y="694" font-size="21" fill="#68645E" font-weight="400">合成例：totalPairs=2，eligiblePairs=1，</text><text x="24" y="723" font-size="21" fill="#68645E" font-weight="400">候选 pass rate 仍为 100%。</text><text x="24" y="766" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>