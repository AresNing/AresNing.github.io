<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Grok：正常返回没走到，也要保留终态线索</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 10</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：正常返回没走到，也要保</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">留终态线索</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">TurnCompletionEmitter</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">持有计时起点与 emitted</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">析构时已经 emit？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">检查本作用域是否走过终态</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">已 emit → 已有正常终态记录</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">Drop 不再补发</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">未 emit → 兜底 task_aborted</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">给异常中止保留线索</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">Drop 兜底依赖正常析构，不保证进程硬杀后</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">仍能记录或导出。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>