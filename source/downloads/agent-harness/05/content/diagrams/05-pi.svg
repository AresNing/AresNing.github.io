<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Pi：前置 Hook 看见的应是实际执行参数</title>
<desc id="desc">prepareArguments 早于 Hook；拒绝不能撤销准备阶段已经产生的效果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b8592"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#6b8592;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#f5f8fa"/>
<text x="64" y="53" font-size="19" fill="#007b70" text-anchor="start" font-weight="400">AGENT HARNESS   /   05   /   Pi</text>
<text x="64" y="130" font-size="42" fill="#17313d" text-anchor="start" font-weight="700">Pi：前置 Hook 看见的应是实际执行参数</text>
<text x="64" y="166" font-size="21" fill="#536c78" text-anchor="start" font-weight="400">条件不同，后续责任不同</text>
<rect x="480" y="190" width="480" height="119" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="480" y="208" width="5" height="83" rx="2" fill="#007b70"/>
<text x="504" y="233" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">参数准备与验证</text>
<text x="504" y="268" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">prepareArguments 先于 Hook</text>
<rect x="480" y="360" width="480" height="119" rx="16" fill="#eef0fa" stroke="#cedbe1"/>
<rect x="480" y="378" width="5" height="83" rx="2" fill="#6c5aa6"/>
<text x="504" y="402" font-size="27" fill="#17313d" text-anchor="start" font-weight="650">beforeToolCall 允许且未取消？</text>
<text x="504" y="437" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">核对实际执行的 prepared args</text>
<path class="edge" d="M720 313 L720 353"/>
<rect x="100" y="554" width="540" height="136" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="100" y="572" width="5" height="100" rx="2" fill="#007b70"/>
<text x="124" y="597" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">进入 execute</text>
<text x="124" y="632" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">使用经过准备与验证的参数</text>
<path class="edge" d="M720 483 L720 513 L370 513 L370 546"/>
<rect x="400.0" y="480" width="290" height="29" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="545.0" y="503" font-size="21" fill="#007b70" text-anchor="middle" font-weight="400">允许且未取消</text>
<rect x="800" y="554" width="540" height="136" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="800" y="572" width="5" height="100" rx="2" fill="#a96a19"/>
<text x="824" y="597" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">生成相应错误结果</text>
<text x="824" y="632" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">不进入该调用的 execute</text>
<path class="edge" d="M720 483 L720 513 L1070 513 L1070 546"/>
<rect x="750.0" y="480" width="290" height="29" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="895.0" y="503" font-size="21" fill="#a96a19" text-anchor="middle" font-weight="400">拒绝或已取消</text>
<rect x="64" y="742" width="1312" height="91" rx="16" fill="#e5f2ee" stroke="#c7dfd6"/>
<text x="87" y="784" font-size="25" fill="#17313d" text-anchor="start" font-weight="500">prepareArguments 早于 Hook；拒绝不能撤销准备阶段已经产生的效果。</text>
<text x="64" y="869" font-size="18" fill="#536c78" text-anchor="start" font-weight="400">固定版本源码路径示意 · 省略非关键分支；完整条件见相邻正文</text>
<text x="1376" y="869" font-size="17" fill="#536c78" text-anchor="end" font-weight="400">P05b</text>
</svg>
