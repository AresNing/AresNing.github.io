<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Pi 示例：killed 标志不证明进程已经退出</title>
<desc id="desc">实验使用受控 Node 子进程；显式强杀并等待退出，另设 watchdog 防止遗留。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b8592"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#6b8592;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#f5f8fa"/>
<text x="64" y="53" font-size="19" fill="#007b70" text-anchor="start" font-weight="400">AGENT HARNESS   /   08   /   Pi</text>
<text x="64" y="130" font-size="42" fill="#17313d" text-anchor="start" font-weight="700">Pi 示例：killed 标志不证明进程已经退出</text>
<text x="64" y="166" font-size="21" fill="#536c78" text-anchor="start" font-weight="400">自上而下为事件次序，不表示时间比例</text>
<rect x="74" y="189" width="332" height="60" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="240" y="229" font-size="27" fill="#17313d" text-anchor="middle" font-weight="650">父调用</text>
<path d="M240 249 L240 716" stroke="#bdcbd3" stroke-dasharray="8 8" stroke-width="2"/>
<rect x="554" y="189" width="332" height="60" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="720" y="229" font-size="27" fill="#17313d" text-anchor="middle" font-weight="650">子进程</text>
<path d="M720 249 L720 716" stroke="#bdcbd3" stroke-dasharray="8 8" stroke-width="2"/>
<rect x="1034" y="189" width="332" height="60" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="1200" y="229" font-size="27" fill="#17313d" text-anchor="middle" font-weight="650">强杀兜底</text>
<path d="M1200 249 L1200 716" stroke="#bdcbd3" stroke-dasharray="8 8" stroke-width="2"/>
<rect x="258.0" y="270" width="444" height="38" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="480.0" y="294" font-size="25" fill="#17313d" text-anchor="middle" font-weight="400">发送 SIGTERM</text>
<path class="edge" d="M252 315 L704 315"/>
<text x="71" y="323" font-size="20" fill="#536c78" text-anchor="start" font-weight="400">1</text>
<rect x="258.0" y="348" width="444" height="38" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="480.0" y="372" font-size="25" fill="#17313d" text-anchor="middle" font-weight="400">killed=true，但进程仍活着</text>
<path class="edge" d="M708 393 L256 393"/>
<text x="71" y="401" font-size="20" fill="#536c78" text-anchor="start" font-weight="400">2</text>
<rect x="310.0" y="426" width="820" height="38" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="720.0" y="450" font-size="25" fill="#17313d" text-anchor="middle" font-weight="400">5 秒计时器触发</text>
<path class="edge" d="M252 471 L1184 471"/>
<text x="71" y="479" font-size="20" fill="#536c78" text-anchor="start" font-weight="400">3</text>
<rect x="310.0" y="504" width="820" height="38" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="720.0" y="528" font-size="25" fill="#17313d" text-anchor="middle" font-weight="400">检查 killed，未继续 SIGKILL</text>
<path class="edge" d="M1188 549 L256 549"/>
<text x="71" y="557" font-size="20" fill="#536c78" text-anchor="start" font-weight="400">4</text>
<rect x="258.0" y="582" width="444" height="38" rx="0" fill="#f5f8fa" stroke="none"/>
<text x="480.0" y="606" font-size="25" fill="#17313d" text-anchor="middle" font-weight="400">实验显式 SIGKILL 后等待退出</text>
<path class="edge" d="M252 627 L704 627"/>
<text x="71" y="635" font-size="20" fill="#536c78" text-anchor="start" font-weight="400">5</text>
<rect x="64" y="742" width="1312" height="91" rx="16" fill="#e5f2ee" stroke="#c7dfd6"/>
<text x="87" y="784" font-size="25" fill="#17313d" text-anchor="start" font-weight="500">实验使用受控 Node 子进程；显式强杀并等待退出，另设 watchdog 防止遗留。</text>
<text x="64" y="869" font-size="18" fill="#536c78" text-anchor="start" font-weight="400">原函数 + 受控真实子进程实测</text>
<text x="1376" y="869" font-size="17" fill="#536c78" text-anchor="end" font-weight="400">P08e</text>
</svg>
