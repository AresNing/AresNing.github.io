<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1370" viewBox="0 0 780 1370" role="img" aria-labelledby="title desc">
<title id="title">快照与事件，共用一个切点</title><desc id="desc">作者设计的交接协议；不是四家统一接口。服务端:先建立事件缓冲，准备快照时，继续接收后续事件；服务端:取得快照 S(2) = AB，快照已覆盖事件 1、2；客户端:先安装快照及切点 2，旧连接的响应不再有权改写视图；客户端:只接入连续的切点后事件，丢弃 1、2；接入 3=C；去重重复 3；客户端:得到 ABC；仍检查缺口，若先收到 5 而缺 4，补页或重建。没有切点：全量可能覆盖新进度，
增量可能重复追加文字。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#19333d}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#61867e" stroke-width="1.5"/></marker></defs>
<rect width="780" height="1370" rx="20" fill="#f5f7f3"/>
<text x="40" y="53" font-size="25" font-weight="600" style="fill:#087a67">AGENT HARNESS / 12</text>
<text x="40" y="111" font-size="42" font-weight="700" style="fill:#19333d">快照与事件，共用一个切点</text>
<text x="40" y="157" font-size="28" font-weight="400" style="fill:#506c66">作者设计的交接协议；不是四家统一接口</text>
<rect x="32" y="196" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="235" font-size="27" font-weight="650" style="fill:#087a67">01  服务端</text>
<text x="55" y="282" font-size="34" font-weight="650" style="fill:#19333d">先建立事件缓冲</text>
<text x="55" y="324" font-size="30" font-weight="400" style="fill:#435d5a">准备快照时，继续接收后续事件</text>
<path d="M390 354 L390 380" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="390" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="429" font-size="27" font-weight="650" style="fill:#087a67">02  服务端</text>
<text x="55" y="476" font-size="34" font-weight="650" style="fill:#19333d">取得快照 S(2) = AB</text>
<text x="55" y="518" font-size="30" font-weight="400" style="fill:#435d5a">快照已覆盖事件 1、2</text>
<path d="M390 548 L390 574" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="584" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="623" font-size="27" font-weight="650" style="fill:#087a67">03  客户端</text>
<text x="55" y="670" font-size="34" font-weight="650" style="fill:#19333d">先安装快照及切点 2</text>
<text x="55" y="712" font-size="30" font-weight="400" style="fill:#435d5a">旧连接的响应不再有权改写视图</text>
<path d="M390 742 L390 768" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="817" font-size="27" font-weight="650" style="fill:#087a67">04  客户端</text>
<text x="55" y="864" font-size="34" font-weight="650" style="fill:#19333d">只接入连续的切点后事件</text>
<text x="55" y="906" font-size="30" font-weight="400" style="fill:#435d5a">丢弃 1、2；接入 3=C；去重重复 3</text>
<path d="M390 936 L390 962" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="972" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="1011" font-size="27" font-weight="650" style="fill:#087a67">05  客户端</text>
<text x="55" y="1058" font-size="34" font-weight="650" style="fill:#19333d">得到 ABC；仍检查缺口</text>
<text x="55" y="1100" font-size="30" font-weight="400" style="fill:#435d5a">若先收到 5 而缺 4，补页或重建</text>
<rect x="32" y="1180" width="716" height="116" rx="18" fill="#e0efe7"/>
<text x="55" y="1226" font-size="32" font-weight="600" style="fill:#19333d">没有切点：全量可能覆盖新进度，</text>
<text x="55" y="1268" font-size="32" font-weight="600" style="fill:#19333d">增量可能重复追加文字。</text>
<text x="40" y="1340" font-size="23" font-weight="400" style="fill:#536c66">作者机制实验 · controlled schedule</text>
</svg>
