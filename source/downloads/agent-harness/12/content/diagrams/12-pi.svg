<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1370" viewBox="0 0 780 1370" role="img" aria-labelledby="title desc">
<title id="title">Pi：快照安装后再放行事件</title><desc id="desc">experimental mini → Lane → durable Harness。mini 客户端:Sessions.attach → lane.watch，取得新 subscription ID 与快照；Lane 串行线:先装观察者，再读快照，分支、队列、operation、最后结果；事件总线:暂存快照交接后的事件，resnapshot 用边界划分新旧阶段；mini 客户端:先安装 snapshot，再 start，新订阅开始后移除旧订阅；当前订阅:完整 message 替换＋事件折叠，重复 entry 并不自动去重。工具恢复到所存检查点；
本入口未承诺自动重连。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#19333d}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#61867e" stroke-width="1.5"/></marker></defs>
<rect width="780" height="1370" rx="20" fill="#f5f7f3"/>
<text x="40" y="53" font-size="25" font-weight="600" style="fill:#087a67">AGENT HARNESS / 12</text>
<text x="40" y="111" font-size="42" font-weight="700" style="fill:#19333d">Pi：快照安装后再放行事件</text>
<text x="40" y="157" font-size="28" font-weight="400" style="fill:#506c66">experimental mini → Lane → durable Harness</text>
<rect x="32" y="196" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="235" font-size="27" font-weight="650" style="fill:#087a67">01  mini 客户端</text>
<text x="55" y="282" font-size="34" font-weight="650" style="fill:#19333d">Sessions.attach → lane.watch</text>
<text x="55" y="324" font-size="30" font-weight="400" style="fill:#435d5a">取得新 subscription ID 与快照</text>
<path d="M390 354 L390 380" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="390" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="429" font-size="27" font-weight="650" style="fill:#087a67">02  Lane 串行线</text>
<text x="55" y="476" font-size="34" font-weight="650" style="fill:#19333d">先装观察者，再读快照</text>
<text x="55" y="518" font-size="30" font-weight="400" style="fill:#435d5a">分支、队列、operation、最后结果</text>
<path d="M390 548 L390 574" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="584" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="623" font-size="27" font-weight="650" style="fill:#087a67">03  事件总线</text>
<text x="55" y="670" font-size="34" font-weight="650" style="fill:#19333d">暂存快照交接后的事件</text>
<text x="55" y="712" font-size="30" font-weight="400" style="fill:#435d5a">resnapshot 用边界划分新旧阶段</text>
<path d="M390 742 L390 768" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="817" font-size="27" font-weight="650" style="fill:#087a67">04  mini 客户端</text>
<text x="55" y="864" font-size="34" font-weight="650" style="fill:#19333d">先安装 snapshot，再 start</text>
<text x="55" y="906" font-size="30" font-weight="400" style="fill:#435d5a">新订阅开始后移除旧订阅</text>
<path d="M390 936 L390 962" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="972" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="1011" font-size="27" font-weight="650" style="fill:#087a67">05  当前订阅</text>
<text x="55" y="1058" font-size="34" font-weight="650" style="fill:#19333d">完整 message 替换＋事件折叠</text>
<text x="55" y="1100" font-size="30" font-weight="400" style="fill:#435d5a">重复 entry 并不自动去重</text>
<rect x="32" y="1180" width="716" height="116" rx="18" fill="#e0efe7"/>
<text x="55" y="1226" font-size="32" font-weight="600" style="fill:#19333d">工具恢复到所存检查点；</text>
<text x="55" y="1268" font-size="32" font-weight="600" style="fill:#19333d">本入口未承诺自动重连。</text>
<text x="40" y="1340" font-size="23" font-weight="400" style="fill:#536c66">固定源码 P12 / P12c / P12e / P12f</text>
</svg>
