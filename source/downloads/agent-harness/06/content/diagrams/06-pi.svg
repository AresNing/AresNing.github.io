<text x="504" y="268" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">读取已有阶段与参数</text>
<rect x="480" y="360" width="480" height="119" rx="16" fill="#eef0fa" stroke="#cedbe1"/>
<rect x="480" y="378" width="5" height="83" rx="2" fill="#6c5aa6"/>
<text x="504" y="403" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">旧、新 replay 声明均 safe？</text>
<text x="504" y="438" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">同时检查调用没有被取消</text>
