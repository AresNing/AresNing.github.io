<svg xmlns="http://www.w3.org/2000/svg" width="480" height="873" viewBox="0 0 480 873" role="img"><title>DeepSeek：滚动补位与有序提交是两条线</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="873" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 04</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：滚动补位与有序提交</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">是两条线</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · 执行池 → 运行中工具</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">同时启动 A、B</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · 运行中工具 → 执行池</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">B 完成，释放一个槽</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">03 · 执行池 → 运行中工具</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">补位启动 C，A 仍未结束</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">04 · 运行中工具 → 提交指针</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">B / C ready，等待前序 A</text><rect x="24" y="654" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="688" font-size="24" fill="#292824" font-weight="650">05 · 运行中工具 → 提交指针</text><text x="42" y="722" font-size="21" fill="#68645E" font-weight="400">A ready 后按 A、B、C 提交</text><text x="24" y="773" font-size="21" fill="#68645E" font-weight="400">示意池容量为 2；C 可以先开始，结果仍按 </text><text x="24" y="802" font-size="21" fill="#68645E" font-weight="400">A、B、C 提交。</text><text x="24" y="845" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>