<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Pi：整批准备屏障之后才并发执行</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 04</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：整批准备屏障之后才并发执</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">行</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分支关系示意，不表示耗时比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">并发批次：整批准备</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">仅获准调用进入 execute</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">分支一 → 工具 A 执行</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">耗时可以较长</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">分支二 → 工具 B 执行</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">可先于 A 完成</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">两支汇合 → 统一组织结果</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">恢复为模型调用顺序</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">一项准备未完成，会影响其他项何时开始；最</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">终结果按原序组织。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>