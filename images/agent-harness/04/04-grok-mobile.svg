<svg xmlns="http://www.w3.org/2000/svg" width="480" height="733" viewBox="0 0 480 733" role="img"><title>Grok：局部路径互斥，不等于业务依赖顺序</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="733" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 04</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：局部路径互斥，不等于业</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">务依赖顺序</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分支关系示意，不表示耗时比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">一批可调度工具</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">建立本批所需路径约束</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">分支一 → 路径相关的调用</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">竞争相应局部锁</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">分支二 → 互不冲突的调用</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">可以并发推进</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">两支汇合 → 完成序 drainer</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">每项完成即进入，不等全部</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">完成序后处理与模型最初调用顺序是不同维度。</text><text x="24" y="705" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>