<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>Grok：输入退化与同输入重试是两个维度</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 03</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：输入退化与同输入重试是</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">两个维度</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分层责任：每一行独立说明一个边界</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Verbatim</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">优先保留原始输入</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">尝试当前档的采样</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Fitted</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">需要时按预算调整输入</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">调整后再采样</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">Lossy</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">需要时允许更多有损缩减</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">使用更小的输入采样</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">重试层</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">相同输入上的暂时失败</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">另按 sampler 重试预算判断</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">不要把请求次数的增加，都算作“模型用同样</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">上下文再试一次”。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>