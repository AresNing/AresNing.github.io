<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img"><title>压缩不是统一的“把旧消息变短”</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="842" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 03</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">压缩不是统一的“把旧消息变短”</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="174" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">远端生成替换内容</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">客户端重建保留项与基线</text><rect x="24" y="314" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="348" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="382" font-size="21" fill="#68645E" font-weight="400">近期 token 目标</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">受合法切点与 split turn 约束</text><rect x="24" y="454" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="488" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="522" font-size="21" fill="#68645E" font-weight="400">异步生成候选摘要</text><text x="42" y="551" font-size="21" fill="#68645E" font-weight="400">安装前验证 surface 稳定性</text><rect x="24" y="594" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="628" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="662" font-size="21" fill="#68645E" font-weight="400">输入预算不足</text><text x="42" y="691" font-size="21" fill="#68645E" font-weight="400">逐档退化，与采样重试分开</text><text x="24" y="742" font-size="21" fill="#68645E" font-weight="400">必须同时交代保留范围、替换时机和后续请求</text><text x="24" y="771" font-size="21" fill="#68645E" font-weight="400">使用的新基线。</text><text x="24" y="814" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>