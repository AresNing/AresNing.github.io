<svg xmlns="http://www.w3.org/2000/svg" width="480" height="873" viewBox="0 0 480 873" role="img"><title>DeepSeek：异步摘要是一场带校验的替换</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="873" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 03</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：异步摘要是一场带校</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">验的替换</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · 当前历史 → 摘要任务</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">捕获待压缩范围</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · 当前历史 → 当前历史</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">摘要等待期间历史可能改变</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">03 · 摘要任务 → 替换检查</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">返回候选摘要</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">04 · 替换检查 → 当前历史</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">核对 whole / selected 范围</text><rect x="24" y="654" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="688" font-size="24" fill="#292824" font-weight="650">05 · 替换检查 → 当前历史</text><text x="42" y="722" font-size="21" fill="#68645E" font-weight="400">校验通过后安装替换</text><text x="24" y="773" font-size="21" fill="#68645E" font-weight="400">摘要等待期间历史可能改变；安装前必须核对</text><text x="24" y="802" font-size="21" fill="#68645E" font-weight="400">所声明的 surface 范围。</text><text x="24" y="845" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>