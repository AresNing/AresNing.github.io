<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Codex remote v2：压缩结果还要经过客户端安装</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 03</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex remote v2：压缩结果还</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">要经过客户端安装</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">远端压缩输出</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">取得替换历史</text><path d="M240 300 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">选择客户端保留项</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">按本地规则保留信息</text><path d="M240 411 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">组合摘要与 metadata</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">形成新的上下文结构</text><path d="M240 522 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">安装并重建基线</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">后续请求基于新历史</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">服务端返回的摘要，不是下一次模型请求的全</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">部内容。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>