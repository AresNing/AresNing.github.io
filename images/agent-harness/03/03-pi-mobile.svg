<svg xmlns="http://www.w3.org/2000/svg" width="480" height="726" viewBox="0 0 480 726" role="img"><title>Pi：预算约束还要服从合法切点</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="726" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 03</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：预算约束还要服从合法切点</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="174" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">估算近期 token</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">从候选保留范围开始</text><rect x="24" y="285" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="319" font-size="24" fill="#292824" font-weight="650">切点是否拆开当前 turn？</text><text x="42" y="353" font-size="21" fill="#68645E" font-weight="400">同时维护消息结构</text><rect x="24" y="396" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="430" font-size="24" fill="#292824" font-weight="650">拆开 turn → split-turn 路径</text><text x="42" y="464" font-size="21" fill="#68645E" font-weight="400">分别处理被拆开的片段</text><rect x="24" y="507" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="541" font-size="24" fill="#292824" font-weight="650">未拆开 → 整 turn 切点</text><text x="42" y="575" font-size="21" fill="#68645E" font-weight="400">保留合法历史后缀</text><text x="24" y="626" font-size="21" fill="#68645E" font-weight="400">近期 token 预算是近似目标，合法切点可能</text><text x="24" y="655" font-size="21" fill="#68645E" font-weight="400">让实际保留量偏离。</text><text x="24" y="698" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>