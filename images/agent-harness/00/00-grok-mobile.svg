<svg xmlns="http://www.w3.org/2000/svg" width="480" height="812" viewBox="0 0 480 812" role="img"><title>Grok：Actor 的控制顺序与工具并发分开</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="812" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：Actor 的控制顺序与工具</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">并发分开</text><rect x="24" y="170" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="204" font-size="24" fill="#292824" font-weight="650">ACP 入口</text><text x="42" y="238" font-size="21" fill="#68645E" font-weight="400">分发后释放 dispatch lock</text><text x="42" y="267" font-size="21" fill="#68645E" font-weight="400">等待 Actor 的终态回复</text><rect x="24" y="304" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="338" font-size="24" fill="#292824" font-weight="650">SessionActor</text><text x="42" y="372" font-size="21" fill="#68645E" font-weight="400">conversation 与 goal gate</text><text x="42" y="401" font-size="21" fill="#68645E" font-weight="400">决定是否继续工作</text><rect x="24" y="438" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="472" font-size="24" fill="#292824" font-weight="650">工具执行器</text><text x="42" y="506" font-size="21" fill="#68645E" font-weight="400">并发调用与局部路径锁</text><text x="42" y="535" font-size="21" fill="#68645E" font-weight="400">按完成顺序后处理</text><rect x="24" y="572" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="606" font-size="24" fill="#292824" font-weight="650">ACP 收尾</text><text x="42" y="640" font-size="21" fill="#68645E" font-weight="400">通知、usage 与 trace</text><text x="42" y="669" font-size="21" fill="#68645E" font-weight="400">再构造最终 response</text><text x="24" y="714" font-size="21" fill="#68645E" font-weight="400">Actor 串行消费控制消息，不能推出所有环</text><text x="24" y="743" font-size="21" fill="#68645E" font-weight="400">境副作用都串行。</text><text x="24" y="784" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>