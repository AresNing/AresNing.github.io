<svg xmlns="http://www.w3.org/2000/svg" width="480" height="776" viewBox="0 0 480 776" role="img"><title>Pi：三层入口承担不同责任</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="776" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：三层入口承担不同责任</text><rect x="24" y="134" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="168" font-size="24" fill="#292824" font-weight="650">轻量 core</text><text x="42" y="202" font-size="21" fill="#68645E" font-weight="400">模型响应与工具批次</text><text x="42" y="231" font-size="21" fill="#68645E" font-weight="400">内部 turn → agent_end</text><rect x="24" y="268" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="302" font-size="24" fill="#292824" font-weight="650">coding-agent RPC</text><text x="42" y="336" font-size="21" fill="#68645E" font-weight="400">预检结果与事件输出</text><text x="42" y="365" font-size="21" fill="#68645E" font-weight="400">输出等待进入结算链</text><rect x="24" y="402" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="436" font-size="24" fill="#292824" font-weight="650">durable Harness</text><text x="42" y="470" font-size="21" fill="#68645E" font-weight="400">持久记录与工具声明</text><text x="42" y="499" font-size="21" fill="#68645E" font-weight="400">恢复时核对双 safe 条件</text><rect x="24" y="536" width="432" height="110" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="570" font-size="24" fill="#292824" font-weight="650">实验调用点</text><text x="42" y="604" font-size="21" fill="#68645E" font-weight="400">固定 streamFn 驱动 core</text><text x="42" y="633" font-size="21" fill="#68645E" font-weight="400">结论限定到被调用模块</text><text x="24" y="678" font-size="21" fill="#68645E" font-weight="400">直接验证 agent-loop，不等于验证 CLI 或</text><text x="24" y="707" font-size="21" fill="#68645E" font-weight="400"> durable Harness 的全部行为。</text><text x="24" y="748" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>