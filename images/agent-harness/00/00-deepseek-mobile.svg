<svg xmlns="http://www.w3.org/2000/svg" width="480" height="696" viewBox="0 0 480 696" role="img"><title>DeepSeek：组合服务之后，仍要验证实例有效</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="696" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：组合服务之后，仍要</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">验证实例有效</text><rect x="24" y="170" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="204" font-size="24" fill="#292824" font-weight="650">profile / bundle</text><text x="42" y="238" font-size="21" fill="#68645E" font-weight="400">选择服务实现</text><path d="M240 254 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="275" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="309" font-size="24" fill="#292824" font-weight="650">SDK 取得 session</text><text x="42" y="343" font-size="21" fill="#68645E" font-weight="400">检查 live agent 身份</text><path d="M240 359 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="380" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="414" font-size="24" fill="#292824" font-weight="650">处理附件后再检查</text><text x="42" y="448" font-size="21" fill="#68645E" font-weight="400">排除旧 Agent Loop句柄</text><path d="M240 464 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="485" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="519" font-size="24" fill="#292824" font-weight="650">followup → driver</text><text x="42" y="553" font-size="21" fill="#68645E" font-weight="400">输入进入 turn /step</text><text x="24" y="598" font-size="21" fill="#68645E" font-weight="400">跨过附件处理等 await，旧句柄不一定仍指</text><text x="24" y="627" font-size="21" fill="#68645E" font-weight="400">向当前 live agent。</text><text x="24" y="668" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>