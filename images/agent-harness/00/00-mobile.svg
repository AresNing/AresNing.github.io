<svg xmlns="http://www.w3.org/2000/svg" width="480" height="892" viewBox="0 0 480 892" role="img"><title>一次任务经过哪些层</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="892" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">一次任务经过哪些层</text><rect x="24" y="134" width="432" height="139" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="168" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="202" font-size="21" fill="#68645E" font-weight="400">输入准入后保持 step 请求视图</text><text x="42" y="231" font-size="21" fill="#68645E" font-weight="400">固定源码 c4017a87aacc · 取证卡 </text><text x="42" y="260" font-size="21" fill="#68645E" font-weight="400">C09b</text><rect x="24" y="297" width="432" height="139" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="331" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="365" font-size="21" fill="#68645E" font-weight="400">循环、RPC 与 durable 路径分读</text><text x="42" y="394" font-size="21" fill="#68645E" font-weight="400">固定源码 71dca871bc80 · 取证卡 </text><text x="42" y="423" font-size="21" fill="#68645E" font-weight="400">P01</text><rect x="24" y="460" width="432" height="139" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="494" font-size="24" fill="#292824" font-weight="650">DeepSeek Harness</text><text x="42" y="528" font-size="21" fill="#68645E" font-weight="400">组合服务与 live 实例校验</text><text x="42" y="557" font-size="21" fill="#68645E" font-weight="400">固定源码 c291e7961a51 · 取证卡 </text><text x="42" y="586" font-size="21" fill="#68645E" font-weight="400">D09b</text><rect x="24" y="623" width="432" height="139" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="657" font-size="24" fill="#292824" font-weight="650">Grok Build</text><text x="42" y="691" font-size="21" fill="#68645E" font-weight="400">Actor 分发与