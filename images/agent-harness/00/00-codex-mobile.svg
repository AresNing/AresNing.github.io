<svg xmlns="http://www.w3.org/2000/svg" width="480" height="696" viewBox="0 0 480 696" role="img"><title>Codex：从输入准入到一致的执行视图</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="696" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 00</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：从输入准入到一致的执行</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">视图</text><rect x="24" y="170" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="204" font-size="24" fill="#292824" font-weight="650">输入准入</text><text x="42" y="238" font-size="21" fill="#68645E" font-weight="400">Started 或 Steered</text><path d="M240 254 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="275" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="309" font-size="24" fill="#292824" font-weight="650">捕获 StepContext</text><text x="42" y="343" font-size="21" fill="#68645E" font-weight="400">上下文、设置与工具视图</text><path d="M240 359 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="380" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="414" font-size="24" fill="#292824" font-weight="650">模型采样与工具路由</text><text x="42" y="448" font-size="21" fill="#68645E" font-weight="400">共用此次 step 视图</text><path d="M240 464 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="485" width="432" height="81" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="519" font-size="24" fill="#292824" font-weight="650">继续或退出</text><text x="42" y="553" font-size="21" fill="#68645E" font-weight="400">还要检查欠工作与停止门</text><text x="24" y="598" font-size="21" fill="#68645E" font-weight="400">同一请求的工具说明与执行路由，需要能对应</text><text x="24" y="627" font-size="21" fill="#68645E" font-weight="400">同一份 step 视图。</text><text x="24" y="668" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>