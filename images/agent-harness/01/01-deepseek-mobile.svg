<svg xmlns="http://www.w3.org/2000/svg" width="480" height="937" viewBox="0 0 480 937" role="img"><title>DeepSeek：取消与唤醒交错时，谁接管输入</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="937" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 01</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：取消与唤醒交错时，</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">谁接管输入</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · 输入 / 观察者 → Agent </text><text x="42" y="276" font-size="24" fill="#292824" font-weight="650">状态</text><text x="42" y="310" font-size="21" fill="#68645E" font-weight="400">输入抵达取消中的 Agent</text><rect x="24" y="353" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="387" font-size="24" fill="#292824" font-weight="650">02 · Agent 状态 → driver</text><text x="42" y="421" font-size="21" fill="#68645E" font-weight="400">旧 driver 进入收尾</text><rect x="24" y="464" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">03 · driver → Agent 状态</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">捕获 wakingAfterAbort</text><rect x="24" y="575" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">04 · Agent 状态 → 输入 / 观</text><text x="42" y="641" font-size="24" fill="#292824" font-weight="650">察者</text><text x="42" y="675" font-size="21" fill="#68645E" font-weight="400">通知状态观察者</text><rect x="24" y="718" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="752" font-size="24" fill="#292824" font-weight="650">05 · Agent 状态 → driver</text><text x="42" y="786" font-size="21" fill="#68645E" font-weight="400">必要时交给下一次 driver</text><text x="24" y="837" font-size="21" fill="#68645E" font-weight="400">先记录取消后的唤醒状态，再通知观察者，避</text><text x="24" y="866" font-size="21" fill="#68645E" font-weight="400">免重入把归属弄乱。</text><text x="24" y="909" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>