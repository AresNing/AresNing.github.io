<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Grok：conversation 外还有继续工作的条件</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 01</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：conversation 外还有继</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">续工作的条件</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">conversation loop</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">模型与工具交替</text><path d="M240 300 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">取得本轮 outcome</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">完成、取消或轮数上限</text><path d="M240 411 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">外层 goal / stop gate</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">决定继续或停止</text><path d="M240 522 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">按 outcome 收尾</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">特定终态触发子任务取消</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">Cancelled / MaxTurnsReached 的处理，</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">不能推广到所有结束原因。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>