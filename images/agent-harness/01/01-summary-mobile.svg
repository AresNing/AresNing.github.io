<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>不要把四种 turn 当作同一统计单位</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 01</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">不要把四种 turn 当作同一统计</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">单位</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">模型与工具暂时无新工作</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">仍需经过停止门</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">一次内部 turn_end</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">未必到 agent_end 或 settled</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">旧 driver 正在取消</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">新唤醒可能交给下一次 driver</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">conversation 已给 outcome</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">外层 goal / stop gate 再判断</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">结束标志只属于它所在的一层；继续条件与资</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">源结算还要分别追。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>