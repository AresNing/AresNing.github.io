<svg xmlns="http://www.w3.org/2000/svg" width="480" height="969" viewBox="0 0 480 969" role="img"><title>DeepSeek / Cordis：先登记清理，再异步初始化</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="969" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 07</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek / Cordis：先登记清</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">理，再异步初始化</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · Fiber owner → disposer</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">先登记包装 disposer</text><rect x="24" y="321" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · Fiber owner → effect </text><text x="42" y="387" font-size="24" fill="#292824" font-weight="650">setup</text><text x="42" y="421" font-size="21" fill="#68645E" font-weight="400">开始异步 setup</text><rect x="24" y="464" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">03 · Fiber owner → disposer</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">卸载发生，发起清理</text><rect x="24" y="575" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">04 · disposer → effect </text><text x="42" y="641" font-size="24" fill="#292824" font-weight="650">setup</text><text x="42" y="675" font-size="21" fill="#68645E" font-weight="400">等待 setup barrier</text><rect x="24" y="718" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="752" font-size="24" fill="#292824" font-weight="650">05 · effect setup → </text><text x="42" y="784" font-size="24" fill="#292824" font-weight="650">disposer</text><text x="42" y="818" font-size="21" fill="#68645E" font-weight="400">返回清理函数并执行</text><text x="24" y="869" font-size="21" fill="#68645E" font-weight="400">同一 effect 内逆序清理；不同 effects </text><text x="24" y="898" font-size="21" fill="#68645E" font-weight="400">的卸载可能并发。</text><text x="24" y="941" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>