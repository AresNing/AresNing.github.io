<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Codex：同步 Hook 可以并发，改写按完成序选择</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 07</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：同步 Hook 可以并发，改</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">写按完成序选择</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分支关系示意，不表示耗时比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">同一份 input_json</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">分发给所有匹配同步 Hook</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">分支一 → Hook A</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">读取原输入并返回改写</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">分支二 → Hook B</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">读取原输入并返回改写</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">两支汇合 → 结果聚合</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">有 block 则阻断；否则取最后有效改写</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">A、B 各读原 input；不是 B(A(input))，</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">展示顺序也不是冲突胜出顺序。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>