<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>Hook 的组合规则比 Hook 名称更重要</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 07</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Hook 的组合规则比 Hook 名称更</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">重要</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">并发读取原 input</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">无 block 时按完成序取改写</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">Pi durable</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">前一 Hook 的输出</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">成为后一 Hook 的输入</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">DeepSeek / Cordis</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">setup 与 provider epoch</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">决定清理和重新加载责任</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">顺序读取同一原 envelope</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">后改写覆盖；Deny 立即短路</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">判断顺序、变换输入与生命周期是三份契约；</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">阻断工具不回滚 Hook 副作用。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>