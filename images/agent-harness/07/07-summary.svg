<rect x="64" y="589" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="637" font-size="26" fill="#292824" text-anchor="start" font-weight="650">Grok</text>
<text x="356" y="638" font-size="27" fill="#292824" text-anchor="start" font-weight="400">顺序读取同一原 envelope</text>
<path class="edge" d="M794 645 L865 645"/>
<text x="897" y="637" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">后改写覆盖；Deny 立即短路</text>
