<text x="356" y="248" font-size="27" fill="#292824" text-anchor="start" font-weight="400">并发读取原 input</text>
<path class="edge" d="M794 255 L865 255"/>
<text x="897" y="247" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">无 block 时按完成序取改写</text>
<rect x="64" y="329" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="329" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="377" font-size="26" fill="#292824" text-anchor="start" font-weight="650">Pi durable</text>
<text x="356" y="378" font-size="27" fill="#292824" text-anchor="start" font-weight="400">前一 Hook 的输出</text>
<path class="edge" d="M794 385 L865 385"/>
<text x="897" y="377" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">成为后一 Hook 的输入</text>
<rect x="64" y="459" width="1312" height="112" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="459" width="260" height="112" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="86" y="507" font-size="26" fill="#292824" text-anchor="start" font-weight="650">DeepSeek /</text>
<text x="86" y="540" font-size="26" fill="#292824" text-anchor="start" font-weight="650">Cordis</text>
<text x="356" y="508" font-size="27" fill="#292824" text-anchor="start" font-weight="400">setup 与 provider epoch</text>
<path class="edge" d="M794 515 L865 515"/>
<text x="897" y="507" font-size="26" fill="#964D3B" text-anchor="start" font-weight="550">决定清理和重新加载责任</text>
