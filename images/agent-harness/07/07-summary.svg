<rect width="1440" height="900" fill="#F7F5EF"/>
<text x="64" y="53" font-size="19" fill="#964D3B" text-anchor="start" font-weight="400">AGENT HARNESS   /   07   /   本篇总结</text>
<text x="64" y="130" font-size="42" fill="#292824" text-anchor="start" font-weight="700">Hook 的组合规则比 Hook 名称更重要</text>
<text x="64" y="166" font-size="21" fill="#68645E" text-anchor="start" font-weight="400">四者对照：保留机制差异，不作能力排名</text>
