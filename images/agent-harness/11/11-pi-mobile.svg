<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>设计启发 · Pi：别用一个 cancelled 表示全部结束</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 11</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">设计启发 · Pi：别用一个 </text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">cancelled 表示全部结束</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分层责任：每一行独立说明一个边界</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">信号层</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">已经请求取消</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">不证明运行已停止</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">准入层</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">停止接纳新工作</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">不撤销已发生副作用</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">执行层</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">在途调用已结算</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">不自动证明子进程退出</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">资源层</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">所属进程真正退出</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">由资源所有者确认回收</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">当前查看器只显示观察点；分阶段取消是后续</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">运行接口的建议。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>