<svg xmlns="http://www.w3.org/2000/svg" width="480" height="835" viewBox="0 0 480 835" role="img"><title>只读轨迹查看器的数据路径</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="835" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 11</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">只读轨迹查看器的数据路径</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">六个节点，六条关系；两条分支汇合</text><rect x="24" y="174" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">固定实验 JSONL</text><rect x="24" y="256" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="290" font-size="24" fill="#292824" font-weight="650">校验场景与递增序号</text><rect x="24" y="338" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="372" font-size="24" fill="#292824" font-weight="650">保留原始记录</text><rect x="24" y="420" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="454" font-size="24" fill="#292824" font-weight="650">分支一 → 内嵌原始数据</text><rect x="24" y="502" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="536" font-size="24" fill="#292824" font-weight="650">分支二 → 按场景和 call ID 收集</text><text x="42" y="568" font-size="24" fill="#292824" font-weight="650">观察</text><text x="42" y="602" font-size="21" fill="#68645E" font-weight="400">随后汇入：内嵌原始数据</text><rect x="24" y="645" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="679" font-size="24" fill="#292824" font-weight="650">只读 HTML</text><text x="24" y="735" font-size="21" fill="#68645E" font-weight="400">原始记录直接内嵌；收集到的观察也汇入 </text><text x="24" y="764" font-size="21" fill="#68645E" font-weight="400">HTML 数据。</text><text x="24" y="807" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>