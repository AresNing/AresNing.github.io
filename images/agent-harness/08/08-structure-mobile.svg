<svg xmlns="http://www.w3.org/2000/svg" width="480" height="745" viewBox="0 0 480 745" role="img"><title>子任务从预留身份到清理结算</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="745" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 08</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">子任务从预留身份到清理结算</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">六个节点，五条推进关系</text><rect x="24" y="174" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">预留身份与容量</text><path d="M240 235 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="256" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="290" font-size="24" fill="#292824" font-weight="650">创建资源</text><path d="M240 317 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="338" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="372" font-size="24" fill="#292824" font-weight="650">发布到注册表</text><path d="M240 399 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="420" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="454" font-size="24" fill="#292824" font-weight="650">首条输入接纳</text><path d="M240 481 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="502" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="536" font-size="24" fill="#292824" font-weight="650">执行与结果</text><path d="M240 563 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="584" width="432" height="58" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="618" font-size="24" fill="#292824" font-weight="650">清理结算</text><text x="24" y="674" font-size="21" fill="#68645E" font-weight="400">依次跨越创建、可见性、工作接纳与清理边界。</text><text x="24" y="717" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>