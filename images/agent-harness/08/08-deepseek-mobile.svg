<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>DeepSeek：结果完成后，还要等待句柄清理</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 08</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：结果完成后，还要等</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">待句柄清理</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">捕获委派策略</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">有服务时：approval=never</text><path d="M240 300 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">创建并交接子句柄</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">区分发布前后所有权</text><path d="M240 411 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">result 已生成</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">得到 stopReason 与output</text><path d="M240 522 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">settleRun 等待 dispose</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">清理失败可使 job 失败</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">成功结果不能掩盖 dispose 失败；两种错误</text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">可一起保留。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>