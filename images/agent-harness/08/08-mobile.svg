<svg xmlns="http://www.w3.org/2000/svg" width="480" height="958" viewBox="0 0 480 958" role="img"><title>子 Agent 的责任归属</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="958" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 08</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">子 Agent 的责任归属</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">独立上下文、进程和工作区分别检查</text><rect x="24" y="174" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">注册身份早于首条消息成功</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">固定源码 c4017a87aacc · 取证卡 </text><text x="42" y="300" font-size="21" fill="#68645E" font-weight="400">C08e</text><rect x="24" y="343" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="377" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">示例取消需验证实际进程退出</text><text x="42" y="440" font-size="21" fill="#68645E" font-weight="400">固定源码 71dca871bc80 · 取证卡 </text><text x="42" y="469" font-size="21" fill="#68645E" font-weight="400">P08e</text><rect x="24" y="512" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="546" font-size="24" fill="#292824" font-weight="650">DeepSeek Harness</text><text x="42" y="580" font-size="21" fill="#68645E" font-weight="400">委派策略与结果后资源结算</text><text x="42" y="609" font-size="21" fill="#68645E" font-weight="400">固定源码 c291e7961a51 · 取证卡 </text><text x="42" y="638" font-size="21" fill="#68645E" font-weight="400">D08g</text><rect x="24" y="681" width="432" height="145" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="715" font-size="24" fill="#292824" font-weight="650">Grok Build</text><text x="42" y="749" font-size="21" fill="#68645E" font-weight="400">promotion 前等待退出再删资源</text><text x="42" y="778" font-size="21" fill="#68645E" font-weight="400">固定源码 37949780c144 · 取证卡 </text><text x="42" y="807" font-size="21" fill="#68645E" font-weight="400">G08d</text><text x="24" y="858" font-size="21" fill="#68645E" font-weight="400">新增 7 组检查含真实子进程取消反例；不表</text><text x="24" y="887" font-size="21" fill="#68645E" font-weight="400">示四产品验收通过。</text><text x="24" y="930" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>