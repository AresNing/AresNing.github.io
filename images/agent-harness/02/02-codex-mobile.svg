<svg xmlns="http://www.w3.org/2000/svg" width="480" height="733" viewBox="0 0 480 733" role="img"><title>Codex：可重试分支仍要保留已完成工具</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="733" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 02</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：可重试分支仍要保留已完</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">成工具</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">流消费发生失败</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">本次响应状态未必完整</text><path d="M240 300 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">检查重试与传输预算</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">决定是否还能尝试</text><path d="M240 411 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">重建模型请求</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">保留已提交工具历史</text><path d="M240 522 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">开始新的请求尝试</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">清理失败响应的关联状态</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">传输重试不代表此前发生的工具副作用被撤销。</text><text x="24" y="705" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>