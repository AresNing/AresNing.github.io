<svg xmlns="http://www.w3.org/2000/svg" width="480" height="826" viewBox="0 0 480 826" role="img"><title>Grok：auto 模式要保留 Ask 的来源</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="826" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 05</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：auto 模式要保留 Ask 的</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">来源</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">合并预检结果</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">先处理明确 Deny</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">Ask 是否仅来自分析失败？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">不能夹带明确规则 Ask</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">仅 fail-closed Ask → 允许后续</text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650"> classifier 判断</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">仍须得到后续决策</text><rect x="24" y="575" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">存在 rule-match Ask → 保留明</text><text x="42" y="641" font-size="24" fill="#292824" font-weight="650">确询问要求</text><text x="42" y="675" font-size="21" fill="#68645E" font-weight="400">auto 不替代规则意图</text><text x="24" y="726" font-size="21" fill="#68645E" font-weight="400">只有分析失败来源的 Ask 才可能交给分类器；</text><text x="24" y="755" font-size="21" fill="#68645E" font-weight="400">这本身不等于放行。</text><text x="24" y="798" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>