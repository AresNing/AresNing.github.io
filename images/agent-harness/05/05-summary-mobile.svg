<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img"><title>权限比较要保留批准对象与来源</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="842" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 05</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">权限比较要保留批准对象与来源</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="174" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">一次 action / attempt</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">升级要满足资格与重审条件</text><rect x="24" y="314" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="348" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="382" font-size="21" fill="#68645E" font-weight="400">Hook 看到的 prepared args</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">拒绝保证不越过对应 execute</text><rect x="24" y="454" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="488" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="522" font-size="21" fill="#68645E" font-weight="400">本次 mode 严格扩大</text><text x="42" y="551" font-size="21" fill="#68645E" font-weight="400">一次 grant 不改 standing policy</text><rect x="24" y="594" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="628" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="662" font-size="21" fill="#68645E" font-weight="400">规则 Ask / 分析失败 Ask</text><text x="42" y="691" font-size="21" fill="#68645E" font-weight="400">来源决定 auto 能否接管判断</text><text x="24" y="742" font-size="21" fill="#68645E" font-weight="400">审批决定允许范围，隔离后端落实范围；任何</text><text x="24" y="771" font-size="21" fill="#68645E" font-weight="400">一张图都不能替代 OS 验收。</text><text x="24" y="814" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>