<svg xmlns="http://www.w3.org/2000/svg" width="480" height="794" viewBox="0 0 480 794" role="img"><title>Pi：前置 Hook 看见的应是实际执行参数</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="794" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 05</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi：前置 Hook 看见的应是实际</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">执行参数</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">参数准备与验证</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">prepareArguments 先于 Hook</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">beforeToolCall 允许且未取消？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">核对实际执行的 prepared args</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">允许且未取消 → 进入 execute</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">使用经过准备与验证的参数</text><rect x="24" y="543" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">拒绝或已取消 → 生成相应错误结</text><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">果</text><text x="42" y="643" font-size="21" fill="#68645E" font-weight="400">不进入该调用的 execute</text><text x="24" y="694" font-size="21" fill="#68645E" font-weight="400">prepareArguments 早于 Hook；拒绝不能撤</text><text x="24" y="723" font-size="21" fill="#68645E" font-weight="400">销准备阶段已经产生的效果。</text><text x="24" y="766" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>