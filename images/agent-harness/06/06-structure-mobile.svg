<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1098" viewBox="0 0 480 1098" role="img"><title>外部效果与本地记录之间的故障窗口</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="1098" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 06</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">外部效果与本地记录之间的故障窗</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">口</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">保留六次调用/返回及故障窗口</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · Harness → 本地记录</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">保存调用身份与参数</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · Harness → 副作用所有者</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">执行操作</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">03 · 副作用所有者 → 副作用所</text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">有者</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">提交效果</text><rect x="24" y="575" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">04 · 副作用所有者 → Harness</text><text x="42" y="643" font-size="21" fill="#68645E" font-weight="400">返回确认</text><rect x="24" y="686" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="720" font-size="24" fill="#292824" font-weight="650">故障窗口</text><text x="42" y="754" font-size="21" fill="#68645E" font-weight="400">外部已完成，本地可能仍是 pending</text><rect x="24" y="797" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="831" font-size="24" fill="#292824" font-weight="650">05 · Harness → 本地记录</text><text x="42" y="865" font-size="21" fill="#68645E" font-weight="400">保存结果并完成耐久性屏障</text><rect x="24" y="908" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="942" font-size="24" fill="#292824" font-weight="650">06 · Harness → Harness</text><text x="42" y="976" font-size="21" fill="#68645E" font-weight="400">将结果纳入后续上下文</text><text x="24" y="1027" font-size="21" fill="#68645E" font-weight="400">按事件次序阅读；各边界不天然原子。</text><text x="24" y="1070" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>