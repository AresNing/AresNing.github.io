<svg xmlns="http://www.w3.org/2000/svg" width="480" height="726" viewBox="0 0 480 726" role="img"><title>Codex：先确定哪段历史仍然存活</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="726" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 06</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：先确定哪段历史仍然存活</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">调用 / 数据的推进路径</text><rect x="24" y="174" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">扫描 rollout / rollback</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">确定有效历史范围</text><path d="M240 264 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="285" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="319" font-size="24" fill="#292824" font-weight="650">定位存活 checkpoint</text><text x="42" y="353" font-size="21" fill="#68645E" font-weight="400">排除已撤回的分段</text><path d="M240 375 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="396" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="430" font-size="24" fill="#292824" font-weight="650">安装 checkpoint 基线</text><text x="42" y="464" font-size="21" fill="#68645E" font-weight="400">恢复对应上下文状态</text><path d="M240 486 v18 m-5 -6 l5 6 5 -6" fill="none" stroke="#964D3B" stroke-width="2"/><rect x="24" y="507" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="541" font-size="24" fill="#292824" font-weight="650">正向重放 suffix</text><text x="42" y="575" font-size="21" fill="#68645E" font-weight="400">只应用其后仍有效的事件</text><text x="24" y="626" font-size="21" fill="#68645E" font-weight="400">恢复重建依赖 rollback 与 checkpoint 的</text><text x="24" y="655" font-size="21" fill="#68645E" font-weight="400">关系，不能盲目读最后一条摘要。</text><text x="24" y="698" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>