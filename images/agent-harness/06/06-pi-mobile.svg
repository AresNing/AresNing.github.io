<svg xmlns="http://www.w3.org/2000/svg" width="480" height="826" viewBox="0 0 480 826" role="img"><title>Pi durable：允许重放需要旧声明和新声明同时成立</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="826" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 06</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Pi durable：允许重放需要旧声</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">明和新声明同时成立</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">恢复 effect_pending 记录</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">读取已有阶段与参数</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">旧、新 replay 声明均 safe？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">同时检查调用没有被取消</text><rect x="24" y="432" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">全部条件满足 → 使用已存参数安</text><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">全重放</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">遵循该恢复路径的规则</text><rect x="24" y="575" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">不满足 → 记录 interrupted / </text><text x="42" y="641" font-size="24" fill="#292824" font-weight="650">unknown</text><text x="42" y="675" font-size="21" fill="#68645E" font-weight="400">不冒充未执行或成功</text><text x="24" y="726" font-size="21" fill="#68645E" font-weight="400">缺失结果只能说明未知；不满足安全条件时不</text><text x="24" y="755" font-size="21" fill="#68645E" font-weight="400">能偷偷重新执行。</text><text x="24" y="798" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>