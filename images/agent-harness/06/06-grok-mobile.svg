<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>Grok：恢复要分别检查各个状态域</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 06</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Grok：恢复要分别检查各个状态</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">域</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分层责任：每一行独立说明一个边界</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">Git 状态</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">独立的恢复尝试</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">可能先于文件恢复失败</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">文件快照</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">执行 filesystem rewind</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">返回值主要反映这一域</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">持久 checkpoint 数据</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">保存或重新读取缓存</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">不自动等于 live 状态恢复</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">生产 tracker</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">仍需实际消费恢复数据</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">本文检查范围内存在未接线端</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">文件 rewind 返回成功，不代表 Git、会话</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">与 live tracker 都完成恢复。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>