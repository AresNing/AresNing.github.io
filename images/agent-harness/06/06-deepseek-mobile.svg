<svg xmlns="http://www.w3.org/2000/svg" width="480" height="878" viewBox="0 0 480 878" role="img"><title>DeepSeek：可见、排队与持久化是不同承诺</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="878" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 06</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：可见、排队与持久化</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">是不同承诺</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分层责任：每一行独立说明一个边界</text><rect x="24" y="210" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">通用会话接口</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">append 后内存可见</text><text x="42" y="307" font-size="21" fill="#68645E" font-weight="400">具体持久性由后端承担</text><rect x="24" y="350" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="384" font-size="24" fill="#292824" font-weight="650">实时事件路径</text><text x="42" y="418" font-size="21" fill="#68645E" font-weight="400">先进入待写队列</text><text x="42" y="447" font-size="21" fill="#68645E" font-weight="400">drain 后再完成相应 flush</text><rect x="24" y="490" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="524" font-size="24" fill="#292824" font-weight="650">显式 JSONL 路径</text><text x="42" y="558" font-size="21" fill="#68645E" font-weight="400">按存储实现执行写入</text><text x="42" y="587" font-size="21" fill="#68645E" font-weight="400">更新已持久化 cursor</text><rect x="24" y="630" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="664" font-size="24" fill="#292824" font-weight="650">错误与恢复</text><text x="42" y="698" font-size="21" fill="#68645E" font-weight="400">失败重排、修复尾部</text><text x="42" y="727" font-size="21" fill="#68645E" font-weight="400">不能跳过未成功的写入</text><text x="24" y="778" font-size="21" fill="#68645E" font-weight="400">观察到 session 事件，不代表 JSONL 存储</text><text x="24" y="807" font-size="21" fill="#68645E" font-weight="400">已经完成对应写入。</text><text x="24" y="850" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>