<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img"><title>外部效果与本地记录之间的故障窗口</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#964D3B"/></marker></defs><rect width="900" height="880" fill="#F7F5EF"/><text x="32" y="40" font-size="18" text-anchor="start" fill="#964D3B">AGENT HARNESS / 06</text><text x="32" y="90" font-size="30" text-anchor="start" fill="#292824">外部效果与本地记录之间的故障窗口</text><rect x="45" y="130" width="230" height="55" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="160" y="166" font-size="24" text-anchor="middle" fill="#292824">Harness</text><path d="M160 190 V790" stroke="#DCD7CD" stroke-dasharray="6 6"/><rect x="335" y="130" width="230" height="55" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="450" y="166" font-size="24" text-anchor="middle" fill="#292824">本地记录</text><path d="M450 190 V790" stroke="#DCD7CD" stroke-dasharray="6 6"/><rect x="625" y="130" width="230" height="55" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="740" y="166" font-size="24" text-anchor="middle" fill="#292824">副作用所有者</text><path d="M740 190 V790" stroke="#DCD7CD" stroke-dasharray="6 6"/><path d="M160 250 H450" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><text x="305.0" y="235" font-size="21" text-anchor="middle" fill="#292824">保存调用身份与参数</text><path d="M160 335 H740" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="320" font-size="21" text-anchor="middle" fill="#292824">执行操作</text><path d="M740 420 h90 v35 h-90" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><text x="748" y="405" font-size="21" text-anchor="start" fill="#292824">提交效果</text><path d="M740 505 H160" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="450.0" y="490" font-size="21" text-anchor="middle" fill="#292824">返回确认</text><rect x="45" y="533" width="610" height="55" rx="4" fill="#EFEBE3" stroke="#DCD7CD"/><text x="65" y="566" font-size="20" text-anchor="start" fill="#964D3B">故障窗口：外部已完成，本地可能仍是 pending</text><path d="M160 665 H450" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><text x="305.0" y="650" font-size="21" text-anchor="middle" fill="#292824">保存结果并完成耐久性屏障</text><path d="M160 750 h90 v35 h-90" fill="none" stroke="#964D3B" stroke-width="2" marker-end="url(#arrow)"/><text x="168" y="735" font-size="21" text-anchor="start" fill="#292824">将结果纳入后续上下文</text><text x="32" y="850" font-size="20" text-anchor="start" fill="#68645E">按事件次序阅读；各边界不天然原子。</text></svg>