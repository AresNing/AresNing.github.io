<svg xmlns="http://www.w3.org/2000/svg" width="480" height="826" viewBox="0 0 480 826" role="img"><title>Codex：运行事件与模型源证据可以先后错位</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="826" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 10</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：运行事件与模型源证据可</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">以先后错位</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">分支关系示意，不表示耗时比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">同一次模型响应流</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">工具可在流结束前启动</text><rect x="24" y="321" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">分支一 → runtime code cell 事</text><text x="42" y="387" font-size="24" fill="#292824" font-weight="650">件</text><text x="42" y="421" font-size="21" fill="#68645E" font-weight="400">开始甚至结束已发生</text><rect x="24" y="464" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="498" font-size="24" fill="#292824" font-weight="650">分支二 → 模型输出 payload</text><text x="42" y="532" font-size="21" fill="#68645E" font-weight="400">流结束后提供源项身份</text><rect x="24" y="575" width="432" height="119" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="609" font-size="24" fill="#292824" font-weight="650">两支汇合 → 离线 reducer 建立关</text><text x="42" y="641" font-size="24" fill="#292824" font-weight="650">联</text><text x="42" y="675" font-size="21" fill="#68645E" font-weight="400">有源证据才绑定 code cell</text><text x="24" y="726" font-size="21" fill="#68645E" font-weight="400">runtime 记录不是模型可见历史；源项晚到</text><text x="24" y="755" font-size="21" fill="#68645E" font-weight="400">时先暂存关系。</text><text x="24" y="798" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>