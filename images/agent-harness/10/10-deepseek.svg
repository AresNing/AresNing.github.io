<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek：最高 handoff 游标，不证明连续交付</title>
<desc id="desc">中间记录失败后，后续成功可能让下次捕获直接越过这个缺口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#968A7A"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#968A7A;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#F7F5EF"/>
<text x="64" y="53" font-size="19" fill="#964D3B" text-anchor="start" font-weight="400">AGENT HARNESS   /   10   /   DeepSeek</text>
<text x="64" y="130" font-size="42" fill="#292824" text-anchor="start" font-weight="700">DeepSeek：最高 handoff 游标，不证明连续交付</text>
<text x="64" y="166" font-size="21" fill="#68645E" text-anchor="start" font-weight="400">调用 / 数据的推进路径</text>
<rect x="174" y="253" width="64" height="44" rx="22" fill="#E8D7C9" stroke="none"/>
<text x="206" y="284" font-size="23" fill="#964D3B" text-anchor="middle" font-weight="700">01</text>
<rect x="64" y="324" width="284" height="183" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="64" y="342" width="5" height="147" rx="2" fill="#964D3B"/>
<text x="88" y="367" font-size="28" fill="#292824" text-anchor="start" font-weight="650">seq 0 交接成功</text>
<text x="88" y="402" font-size="22" fill="#68645E" text-anchor="start" font-weight="400">cursor = 0</text>
<path class="edge" d="M352 414 L386 414"/>
<rect x="506" y="253" width="64" height="44" rx="22" fill="#E8D7C9" stroke="none"/>
<text x="538" y="284" font-size="23" fill="#964D3B" text-anchor="middle" font-weight="700">02</text>
<rect x="396" y="324" width="284" height="183" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="396" y="342" width="5" height="147" rx="2" fill="#964D3B"/>
<text x="420" y="367" font-size="28" fill="#292824" text-anchor="start" font-weight="650">seq 1 交接抛错</text>
<text x="420" y="402" font-size="22" fill="#68645E" text-anchor="start" font-weight="400">记录诊断，继续下一条</text>
<path class="edge" d="M684 414 L718 414"/>
<rect x="838" y="253" width="64" height="44" rx="22" fill="#E8D7C9" stroke="none"/>
<text x="870" y="284" font-size="23" fill="#964D3B" text-anchor="middle" font-weight="700">03</text>
<rect x="728" y="324" width="284" height="183" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="728" y="342" width="5" height="147" rx="2" fill="#964D3B"/>
<text x="752" y="367" font-size="28" fill="#292824" text-anchor="start" font-weight="650">seq 2 交接成功</text>
<text x="752" y="402" font-size="22" fill="#68645E" text-anchor="start" font-weight="400">cursor = 2</text>
<path class="edge" d="M1016 414 L1050 414"/>
<rect x="1170" y="253" width="64" height="44" rx="22" fill="#E8D7C9" stroke="none"/>
<text x="1202" y="284" font-size="23" fill="#964D3B" text-anchor="middle" font-weight="700">04</text>
<rect x="1060" y="324" width="284" height="183" rx="16" fill="#ffffff" stroke="#DCD7CD"/>
<rect x="1060" y="342" width="5" height="147" rx="2" fill="#964D3B"/>
<text x="1084" y="365" font-size="26" fill="#292824" text-anchor="start" font-weight="650">下次从 seq 3 开始</text>
<text x="1084" y="400" font-size="22" fill="#68645E" text-anchor="start" font-weight="400">seq 1 不会自动补交</text>
<text x="132" y="619" font-size="27" fill="#68645E" text-anchor="start" font-weight="400">读图时沿箭头寻找交接点，再回到正文核对输入、结果与失败分支。</text>
<rect x="64" y="742" width="1312" height="91" rx="16" fill="#EFEBE3" stroke="#DCD7CD"/>
<text x="87" y="784" font-size="25" fill="#292824" text-anchor="start" font-weight="500">中间记录失败后，后续成功可能让下次捕获直接越过这个缺口。</text>
<text x="64" y="869" font-size="18" fill="#68645E" text-anchor="start" font-weight="400">原 coordinator + 替身 sink 实测</text>
<text x="1376" y="869" font-size="17" fill="#68645E" text-anchor="end" font-weight="400">D10e</text>
