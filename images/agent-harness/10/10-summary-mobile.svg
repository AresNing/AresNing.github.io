<svg xmlns="http://www.w3.org/2000/svg" width="480" height="842" viewBox="0 0 480 842" role="img"><title>观测与评测必须保留缺口和分母</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="842" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 10</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">观测与评测必须保留缺口和分母</text><text x="24" y="132" font-size="18" fill="#68645E" font-weight="400">四者对照：保留机制差异，不作能力排名</text><rect x="24" y="174" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="208" font-size="24" fill="#292824" font-weight="650">Codex</text><text x="42" y="242" font-size="21" fill="#68645E" font-weight="400">原始 runtime 事件</text><text x="42" y="271" font-size="21" fill="#68645E" font-weight="400">有模型源证据才形成语义关系</text><rect x="24" y="314" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="348" font-size="24" fill="#292824" font-weight="650">Pi</text><text x="42" y="382" font-size="21" fill="#68645E" font-weight="400">双方可评分的配对</text><text x="42" y="411" font-size="21" fill="#68645E" font-weight="400">同时报告 total / eligible /errors</text><rect x="24" y="454" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="488" font-size="24" fill="#292824" font-weight="650">DeepSeek</text><text x="42" y="522" font-size="21" fill="#68645E" font-weight="400">最高 handoff cursor</text><text x="42" y="551" font-size="21" fill="#68645E" font-weight="400">不证明中间无缺口或远端交付</text><rect x="24" y="594" width="432" height="116" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="628" font-size="24" fill="#292824" font-weight="650">Grok</text><text x="42" y="662" font-size="21" fill="#68645E" font-weight="400">终态 emit 与 snapshot</text><text x="42" y="691" font-size="21" fill="#68645E" font-weight="400">保留析构边界与消费式明细</text><text x="24" y="742" font-size="21" fill="#68645E" font-weight="400">绿色检查表示指定断言成立；不代表产品可靠</text><text x="24" y="771" font-size="21" fill="#68645E" font-weight="400">性或真实任务质量已验收。</text><text x="24" y="814" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>