<svg xmlns="http://www.w3.org/2000/svg" width="480" height="873" viewBox="0 0 480 873" role="img"><title>DeepSeek：客户端超时，只放弃本地等待</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="873" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 09</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">DeepSeek：客户端超时，只放弃</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">本地等待</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">自上而下为事件次序，不表示时间比例</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">01 · 客户端 → transport</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">发送 request</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">02 · transport → 服务端</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">启动 handler</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">03 · 客户端 → transport</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">超时 abort：删除 pending</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">04 · 服务端 → transport</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">工作继续，迟到响应返回</text><rect x="24" y="654" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="688" font-size="24" fill="#292824" font-weight="650">05 · transport → transport</text><text x="42" y="722" font-size="21" fill="#68645E" font-weight="400">无 pending：忽略迟到响</text><text x="24" y="773" font-size="21" fill="#68645E" font-weight="400">没有 cancel 帧，已进入的服务端 handler</text><text x="24" y="802" font-size="21" fill="#68645E" font-weight="400"> 仍可产生副作用。</text><text x="24" y="845" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>