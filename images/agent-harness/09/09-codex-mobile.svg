<svg xmlns="http://www.w3.org/2000/svg" width="480" height="762" viewBox="0 0 480 762" role="img"><title>Codex：慢消费者的处理取决于连接能力</title><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style><rect width="480" height="762" fill="#F7F5EF"/><text x="24" y="38" font-size="17" fill="#964D3B" font-weight="400">AGENT HARNESS / 09</text><text x="24" y="82" font-size="28" fill="#292824" font-weight="650">Codex：慢消费者的处理取决于连</text><text x="24" y="118" font-size="28" fill="#292824" font-weight="650">接能力</text><text x="24" y="168" font-size="18" fill="#68645E" font-weight="400">条件不同，后续责任不同</text><rect x="24" y="210" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="244" font-size="24" fill="#292824" font-weight="650">准备发送客户端事件</text><text x="42" y="278" font-size="21" fill="#68645E" font-weight="400">进入连接 writer 队列</text><rect x="24" y="321" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="355" font-size="24" fill="#292824" font-weight="650">连接支持主动断开？</text><text x="42" y="389" font-size="21" fill="#68645E" font-weight="400">选择队列满时的策略</text><rect x="24" y="432" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="466" font-size="24" fill="#292824" font-weight="650">可断开 → try_send：满则断开</text><text x="42" y="500" font-size="21" fill="#68645E" font-weight="400">隔离慢消费者</text><rect x="24" y="543" width="432" height="87" rx="3" fill="#EFEBE3" stroke="#DCD7CD"/><text x="42" y="577" font-size="24" fill="#292824" font-weight="650">不可这样断开 → send().await</text><text x="42" y="611" font-size="21" fill="#68645E" font-weight="400">向发送链传回背压</text><text x="24" y="662" font-size="21" fill="#68645E" font-weight="400">断开连接不等于统一中断仍由 core 持有的 </text><text x="24" y="691" font-size="21" fill="#68645E" font-weight="400">turn。</text><text x="24" y="734" font-size="16" fill="#68645E" font-weight="400">固定版本源码与证据边界见正文</text></svg>