<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="48" y="70" font-size="28" fill="#292824">写注释之前，先检查表达意图的方式</text><path d="M48 104H912" stroke="#dcd7cd"/><rect x="48" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="68" y="208" font-size="18" fill="#964d3b">01</text><text x="68" y="251" font-size="22" fill="#292824">名字能说清楚吗？</text><text x="68" y="289" font-size="16" fill="#68645e">命名</text><text x="68" y="332" font-size="16" fill="#68645e">给变量与函数明确的名字</text><path d="M318 274h22m-7-6 7 6-7 6" fill="none" stroke="#964d3b"/><rect x="348" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="368" y="208" font-size="18" fill="#964d3b">02</text><text x="368" y="251" font-size="22" fill="#292824">代码能更直接吗？</text><text x="368" y="289" font-size="16" fill="#68645e">提取与整理</text><text x="368" y="332" font-size="16" fill="#68645e">让结构表达操作的目的</text><path d="M618 274h22m-7-6 7 6-7 6" fill="none" stroke="#964d3b"/><rect x="648" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="668" y="208" font-size="18" fill="#964d3b">03</text><text x="668" y="251" font-size="22" fill="#292824">还缺什么背景？</text><text x="668" y="289" font-size="16" fill="#68645e">必要的解释</text><text x="668" y="332" font-size="16" fill="#68645e">保留原因、限制与不明显的约</text><text x="668" y="359" font-size="16" fill="#68645e">定</text><text x="48" y="459" font-size="17" fill="#68645e">根据本篇学习要点整理；判断应结合具体代码。</text><text x="48" y="503" font-size="15" fill="#964d3b">AresNing · aresning.github.io</text></g></svg>