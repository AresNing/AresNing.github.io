<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="48" y="70" font-size="28" fill="#292824">让名字承载读者需要的信息</text><path d="M48 104H912" stroke="#dcd7cd"/><rect x="48" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="68" y="208" font-size="18" fill="#964d3b">01</text><text x="68" y="251" font-size="22" fill="#292824">用途</text><text x="68" y="289" font-size="16" fill="#68645e">说明角色</text><text x="68" y="332" font-size="16" fill="#68645e">名字对应它在代码中的职责</text><path d="M318 274h22m-7-6 7 6-7 6" fill="none" stroke="#964d3b"/><rect x="348" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="368" y="208" font-size="18" fill="#964d3b">02</text><text x="368" y="251" font-size="22" fill="#292824">完整含义</text><text x="368" y="289" font-size="16" fill="#68645e">少用模糊缩写</text><text x="368" y="332" font-size="16" fill="#68645e">让读者不必猜测缩写</text><path d="M618 274h22m-7-6 7 6-7 6" fill="none" stroke="#964d3b"/><rect x="648" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="668" y="208" font-size="18" fill="#964d3b">03</text><text x="668" y="251" font-size="22" fill="#292824">量与单位</text><text x="668" y="289" font-size="16" fill="#68645e">暴露度量含义</text><text x="668" y="332" font-size="16" fill="#68645e">例如 timeoutMil</text><text x="668" y="359" font-size="16" fill="#68645e">lis 的单位信息</text><text x="48" y="459" font-size="17" fill="#68645e">命名需要上下文；图示用于整理原则，不是机械规则。</text><text x="48" y="503" font-size="15" fill="#964d3b">AresNing · aresning.github.io</text></g></svg>