<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 480 780"><rect width="480" height="780" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="45" font-size="23" fill="#292824">CompletableFuture：把</text><text x="28" y="79" font-size="23" fill="#292824">任务连接成阶段</text><rect x="28" y="118" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="153" font-size="17" fill="#964d3b">01</text><text x="90" y="153" font-size="24" fill="#292824">创建异步任务</text><text x="48" y="192" font-size="18" fill="#68645e">runAsync / supplyAsync</text><text x="48" y="232" font-size="16" fill="#68645e">启动计算，得到完成阶段</text><path d="M240 269v13m-5-5 5 5 5-5" stroke="#964d3b" fill="none"/><rect x="28" y="288" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="323" font-size="17" fill="#964d3b">02</text><text x="90" y="323" font-size="24" fill="#292824">转换或组合结果</text><text x="48" y="362" font-size="18" fill="#68645e">thenApply / thenCombine</text><text x="48" y="402" font-size="16" fill="#68645e">根据依赖关系连接下一步</text><path d="M240 439v13m-5-5 5 5 5-5" stroke="#964d3b" fill="none"/><rect x="28" y="458" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="493" font-size="17" fill="#964d3b">03</text><text x="90" y="493" font-size="24" fill="#292824">观察与处理异常</text><text x="48" y="532" font-size="18" fill="#68645e">whenComplete / exceptionally</text><text x="48" y="572" font-size="16" fill="#68645e">按业务需要记录异常或恢复结果</text><text x="28" y="680" font-size="16" fill="#68645e">阶段描述的是依赖关系，不保证每一步都新建线程。</text><text x="28" y="750" font-size="15" fill="#964d3b">AresNing · aresning.github.io</text></g></svg>