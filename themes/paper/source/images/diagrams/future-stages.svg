<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="48" y="70" font-size="28" fill="#292824">CompletableFuture：把任务连接成阶段</text><path d="M48 104H912" stroke="#dcd7cd"/><rect x="48" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="68" y="208" font-size="18" fill="#964d3b">01</text><text x="68" y="251" font-size="22" fill="#292824">创建异步任务</text><text x="68" y="289" font-size="16" fill="#68645e">runAsync / supplyAsync</text><text x="68" y="332" font-size="16" fill="#68645e">启动计算，得到完成阶段</text><path d="M318 274h22m-7-6 7 6-7 6" fill="none" stroke="#964d3b"/><rect x="348" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="368" y="208" font-size="18" fill="#964d3b">02</text><text x="368" y="251" font-size="22" fill="#292824">转换或组合结果</text><text x="368" y="289" font-size="16" fill="#68645e">thenApply / thenCombine</text><text x="368" y="332" font-size="16" fill="#68645e">根据依赖关系连接下一步</text><path d="M618 274h22m-7-6 7 6-7 6" fill="none" stroke="#964d3b"/><rect x="648" y="170" width="264" height="220" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="668" y="208" font-size="18" fill="#964d3b">03</text><text x="668" y="251" font-size="22" fill="#292824">观察与处理异常</text><text x="668" y="289" font-size="16" fill="#68645e">whenComplete / exceptionally</text><text x="668" y="332" font-size="16" fill="#68645e">按业务需要记录异常或恢复结</text><text x="668" y="359" font-size="16" fill="#68645e">果</text><text x="48" y="459" font-size="17" fill="#68645e">阶段描述的是依赖关系，不保证每一步都新建线程。</text><text x="48" y="503" font-size="15" fill="#964d3b">AresNing · aresning.github.io</text></g></svg>