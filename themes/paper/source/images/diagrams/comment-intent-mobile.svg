<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 480 780"><rect width="480" height="780" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="45" font-size="23" fill="#292824">写注释之前，先检查表达意图的方式</text><rect x="28" y="118" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="153" font-size="17" fill="#964d3b">01</text><text x="90" y="153" font-size="24" fill="#292824">名字能说清楚吗？</text><text x="48" y="192" font-size="18" fill="#68645e">命名</text><text x="48" y="232" font-size="16" fill="#68645e">给变量与函数明确的名字</text><path d="M240 269v13m-5-5 5 5 5-5" stroke="#964d3b" fill="none"/><rect x="28" y="288" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="323" font-size="17" fill="#964d3b">02</text><text x="90" y="323" font-size="24" fill="#292824">代码能更直接吗？</text><text x="48" y="362" font-size="18" fill="#68645e">提取与整理</text><text x="48" y="402" font-size="16" fill="#68645e">让结构表达操作的目的</text><path d="M240 439v13m-5-5 5 5 5-5" stroke="#964d3b" fill="none"/><rect x="28" y="458" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="493" font-size="17" fill="#964d3b">03</text><text x="90" y="493" font-size="24" fill="#292824">还缺什么背景？</text><text x="48" y="532" font-size="18" fill="#68645e">必要的解释</text><text x="48" y="572" font-size="16" fill="#68645e">保留原因、限制与不明显的约定</text><text x="28" y="680" font-size="16" fill="#68645e">根据本篇学习要点整理；判断应结合具体代码。</text><text x="28" y="750" font-size="15" fill="#964d3b">AresNing · aresning.github.io</text></g></svg>