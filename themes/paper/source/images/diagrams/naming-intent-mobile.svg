<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 480 780"><rect width="480" height="780" fill="#f7f5ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="28" y="45" font-size="23" fill="#292824">让名字承载读者需要的信息</text><rect x="28" y="118" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="153" font-size="17" fill="#964d3b">01</text><text x="90" y="153" font-size="24" fill="#292824">用途</text><text x="48" y="192" font-size="18" fill="#68645e">说明角色</text><text x="48" y="232" font-size="16" fill="#68645e">名字对应它在代码中的职责</text><path d="M240 269v13m-5-5 5 5 5-5" stroke="#964d3b" fill="none"/><rect x="28" y="288" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="323" font-size="17" fill="#964d3b">02</text><text x="90" y="323" font-size="24" fill="#292824">完整含义</text><text x="48" y="362" font-size="18" fill="#68645e">少用模糊缩写</text><text x="48" y="402" font-size="16" fill="#68645e">让读者不必猜测缩写</text><path d="M240 439v13m-5-5 5 5 5-5" stroke="#964d3b" fill="none"/><rect x="28" y="458" width="424" height="146" rx="3" fill="#efebe3" stroke="#dcd7cd"/><text x="48" y="493" font-size="17" fill="#964d3b">03</text><text x="90" y="493" font-size="24" fill="#292824">量与单位</text><text x="48" y="532" font-size="18" fill="#68645e">暴露度量含义</text><text x="48" y="572" font-size="16" fill="#68645e">例如 timeoutMillis 的单位信息</text><text x="28" y="680" font-size="16" fill="#68645e">命名需要上下文；图示用于整理原则，不是机械规则。</text><text x="28" y="750" font-size="15" fill="#964d3b">AresNing · aresning.github.io</text></g></svg>