<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">权限比较要保留批准对象与来源</title>
<desc id="desc">审批决定允许范围，隔离后端落实范围；任何一张图都不能替代 OS 验收。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b8592"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#6b8592;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#f5f8fa"/>
<text x="64" y="53" font-size="19" fill="#007b70" text-anchor="start" font-weight="400">AGENT HARNESS   /   05   /   本篇总结</text>
<text x="64" y="130" font-size="42" fill="#17313d" text-anchor="start" font-weight="700">权限比较要保留批准对象与来源</text>
<text x="64" y="166" font-size="21" fill="#536c78" text-anchor="start" font-weight="400">四者对照：保留机制差异，不作能力排名</text>
<rect x="64" y="199" width="1312" height="112" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="64" y="199" width="260" height="112" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="86" y="247" font-size="26" fill="#17313d" text-anchor="start" font-weight="650">Codex</text>
<text x="356" y="248" font-size="27" fill="#17313d" text-anchor="start" font-weight="400">一次 action / attempt</text>
<path class="edge" d="M794 255 L865 255"/>
<text x="897" y="247" font-size="26" fill="#007b70" text-anchor="start" font-weight="550">升级要满足资格与重审条件</text>
<rect x="64" y="329" width="1312" height="112" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="64" y="329" width="260" height="112" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="86" y="377" font-size="26" fill="#17313d" text-anchor="start" font-weight="650">Pi</text>
<text x="356" y="378" font-size="27" fill="#17313d" text-anchor="start" font-weight="400">Hook 看到的 prepared args</text>
<path class="edge" d="M794 385 L865 385"/>
<text x="897" y="377" font-size="26" fill="#007b70" text-anchor="start" font-weight="550">拒绝保证不越过对应 execute</text>
<rect x="64" y="459" width="1312" height="112" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="64" y="459" width="260" height="112" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="86" y="507" font-size="26" fill="#17313d" text-anchor="start" font-weight="650">DeepSeek</text>
<text x="356" y="508" font-size="27" fill="#17313d" text-anchor="start" font-weight="400">本次 mode 严格扩大</text>
<path class="edge" d="M794 515 L865 515"/>
<text x="897" y="507" font-size="26" fill="#007b70" text-anchor="start" font-weight="550">一次 grant 不改 standing policy</text>
<rect x="64" y="589" width="1312" height="112" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="64" y="589" width="260" height="112" rx="16" fill="#eaf1f5" stroke="#cedbe1"/>
<text x="86" y="637" font-size="26" fill="#17313d" text-anchor="start" font-weight="650">Grok</text>
<text x="356" y="638" font-size="27" fill="#17313d" text-anchor="start" font-weight="400">规则 Ask / 分析失败 Ask</text>
<path class="edge" d="M794 645 L865 645"/>
<text x="897" y="637" font-size="26" fill="#007b70" text-anchor="start" font-weight="550">来源决定 auto 能否接管判断</text>
