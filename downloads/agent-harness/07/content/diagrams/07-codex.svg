<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Codex：同步 Hook 可以并发，改写按完成序选择</title>
<desc id="desc">A、B 各读原 input；不是 B(A(input))，展示顺序也不是冲突胜出顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b8592"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif} .edge{fill:none;stroke:#6b8592;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="1440" height="900" fill="#f5f8fa"/>
<text x="64" y="53" font-size="19" fill="#007b70" text-anchor="start" font-weight="400">AGENT HARNESS   /   07   /   Codex</text>
<text x="64" y="130" font-size="42" fill="#17313d" text-anchor="start" font-weight="700">Codex：同步 Hook 可以并发，改写按完成序选择</text>
<text x="64" y="166" font-size="21" fill="#536c78" text-anchor="start" font-weight="400">分支关系示意，不表示耗时比例</text>
<rect x="480" y="193" width="480" height="119" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="480" y="211" width="5" height="83" rx="2" fill="#007b70"/>
<text x="504" y="236" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">同一份 input_json</text>
<text x="504" y="271" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">分发给所有匹配同步 Hook</text>
<rect x="100" y="370" width="540" height="132" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="100" y="388" width="5" height="96" rx="2" fill="#007b70"/>
<text x="124" y="413" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">Hook A</text>
<text x="124" y="448" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">读取原输入并返回改写</text>
<rect x="800" y="370" width="540" height="132" rx="16" fill="#ffffff" stroke="#cedbe1"/>
<rect x="800" y="388" width="5" height="96" rx="2" fill="#007b70"/>
<text x="824" y="413" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">Hook B</text>
<text x="824" y="448" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">读取原输入并返回改写</text>
<rect x="400" y="582" width="640" height="125" rx="16" fill="#eef4fb" stroke="#cedbe1"/>
<rect x="400" y="600" width="5" height="89" rx="2" fill="#275db3"/>
<text x="424" y="625" font-size="28" fill="#17313d" text-anchor="start" font-weight="650">结果聚合</text>
<text x="424" y="660" font-size="22" fill="#536c78" text-anchor="start" font-weight="400">有 block 则阻断；否则取最后有效改写</text>
<path class="edge" d="M720 316 L720 340 L370 340 L370 362"/>
<path class="edge" d="M370 506 L370 540 L720 540 L720 574"/>
<path class="edge" d="M720 316 L720 340 L1070 340 L1070 362"/>
<path class="edge" d="M1070 506 L1070 540 L720 540 L720 574"/>
<rect x="64" y="742" width="1312" height="91" rx="16" fill="#e5f2ee" stroke="#c7dfd6"/>
<text x="87" y="784" font-size="25" fill="#17313d" text-anchor="start" font-weight="500">A、B 各读原 input；不是 B(A(input))，展示顺序也不是冲突胜出顺序。</text>
<text x="64" y="869" font-size="18" fill="#536c78" text-anchor="start" font-weight="400">固定版本源码路径示意 · 省略非关键分支；完整条件见相邻正文</text>
<text x="1376" y="869" font-size="17" fill="#536c78" text-anchor="end" font-weight="400">C07c · C07d</text>
