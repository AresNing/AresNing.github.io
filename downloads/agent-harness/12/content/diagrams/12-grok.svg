<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1370" viewBox="0 0 780 1370" role="img" aria-labelledby="title desc">
<title id="title">Grok：回放尾部接上实时输出</title><desc id="desc">pager → ACP session/load → updates.jsonl。pager:以原 session＋cursor 发起 load，这里用 load；resume 可跳过回放；resident 会话:关闭 live gate，尝试 flush，任务可能继续；先协调对外输出；日志回放:读取日志，记下末尾字节位置，cursor 可靠则补尾，否则全量回放；日志 → gateway:再次 flush，同步入队新增尾部，完成交接后，重新打开 live gate；pager:提交全量或增量视图，失败恢复旧视图；两条流分别去重。回放过滤部分 InProgress；flush 失败另有降级。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#19333d}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#61867e" stroke-width="1.5"/></marker></defs>
<rect width="780" height="1370" rx="20" fill="#f5f7f3"/>
<text x="40" y="53" font-size="25" font-weight="600" style="fill:#087a67">AGENT HARNESS / 12</text>
<text x="40" y="111" font-size="42" font-weight="700" style="fill:#19333d">Grok：回放尾部接上实时输出</text>
<text x="40" y="157" font-size="28" font-weight="400" style="fill:#506c66">pager → ACP session/load → updates.jsonl</text>
<rect x="32" y="196" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="235" font-size="27" font-weight="650" style="fill:#087a67">01  pager</text>
<text x="55" y="282" font-size="34" font-weight="650" style="fill:#19333d">以原 session＋cursor 发起 load</text>
<text x="55" y="324" font-size="30" font-weight="400" style="fill:#435d5a">这里用 load；resume 可跳过回放</text>
<path d="M390 354 L390 380" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="390" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="429" font-size="27" font-weight="650" style="fill:#087a67">02  resident 会话</text>
<text x="55" y="476" font-size="34" font-weight="650" style="fill:#19333d">关闭 live gate，尝试 flush</text>
<text x="55" y="518" font-size="30" font-weight="400" style="fill:#435d5a">任务可能继续；先协调对外输出</text>
<path d="M390 548 L390 574" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="584" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="623" font-size="27" font-weight="650" style="fill:#087a67">03  日志回放</text>
<text x="55" y="670" font-size="34" font-weight="650" style="fill:#19333d">读取日志，记下末尾字节位置</text>
<text x="55" y="712" font-size="30" font-weight="400" style="fill:#435d5a">cursor 可靠则补尾，否则全量回放</text>
<path d="M390 742 L390 768" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="817" font-size="27" font-weight="650" style="fill:#087a67">04  日志 → gateway</text>
<text x="55" y="864" font-size="34" font-weight="650" style="fill:#19333d">再次 flush，同步入队新增尾部</text>
<text x="55" y="906" font-size="30" font-weight="400" style="fill:#435d5a">完成交接后，重新打开 live gate</text>
<path d="M390 936 L390 962" stroke="#61867e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="972" width="716" height="158" rx="18" fill="white" stroke="#c8d9d1" stroke-width="2"/>
<text x="55" y="1011" font-size="27" font-weight="650" style="fill:#087a67">05  pager</text>
<text x="55" y="1058" font-size="34" font-weight="650" style="fill:#19333d">提交全量或增量视图</text>
<text x="55" y="1100" font-size="30" font-weight="400" style="fill:#435d5a">失败恢复旧视图；两条流分别去重</text>
<rect x="32" y="1180" width="716" height="116" rx="18" fill="#e0efe7"/>
<text x="55" y="1226" font-size="32" font-weight="600" style="fill:#19333d">回放过滤部分 InProgress；flush 失败另有</text>
<text x="55" y="1268" font-size="32" font-weight="600" style="fill:#19333d">降级。</text>
<text x="40" y="1340" font-size="23" font-weight="400" style="fill:#536c66">固定源码 G12 / G12f / G12i / G12k</text>
</svg>
