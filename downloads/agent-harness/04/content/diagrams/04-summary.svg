<text x="86" y="507" font-size="26" fill="#17313d" text-anchor="start" font-weight="650">DeepSeek</text>
<text x="356" y="508" font-size="27" fill="#17313d" text-anchor="start" font-weight="400">滚动补位启动新工具</text>
<path class="edge" d="M794 515 L865 515"/>
